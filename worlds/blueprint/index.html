<!DOCTYPE html>
<html lang="en" data-world="blueprint" data-switcher="br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Drawing GS-26 — Grigory Shatalin</title>
<meta name="description" content="Grigory Shatalin, software engineer — a general arrangement drawing, revision history included." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="../../shared/data.js"></script>
<script src="../../shared/kit.js"></script>
<style>
:root {
  --paper: #0f3c70;
  --ink: #e9f2ff;
  --ink2: rgba(233,242,255,.62);
  --cyan: #9fdcff;
  --red: #ff8f7e;
  --hand: "Architects Daughter", cursive;
  --tech: "Barlow Condensed", "Arial Narrow", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0a2a50; color: var(--ink); font-family: var(--tech); }
.viewport { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: grab;
  background: radial-gradient(ellipse at 50% 40%, #0d3463, #071c38 80%); }
.viewport.drag { cursor: grabbing; }
.sheet {
  position: absolute; left: 0; top: 0; width: 3200px; height: 2000px; transform-origin: 0 0;
  background:
    linear-gradient(rgba(255,255,255,.075) 1px, transparent 1px) 0 0 / 100px 100px,
    linear-gradient(90deg, rgba(255,255,255,.075) 1px, transparent 1px) 0 0 / 100px 100px,
    linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 20px 20px,
    linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 20px 20px,
    radial-gradient(ellipse at 40% 35%, #1a5596, #0f3c70 70%);
  box-shadow: 0 30px 120px rgba(0,0,0,.6);
  user-select: none; -webkit-user-select: none;
}
.sheet::after { /* paper mottling */
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5; mix-blend-mode: soft-light;
  background: radial-gradient(circle at 20% 80%, rgba(255,255,255,.12), transparent 30%), radial-gradient(circle at 80% 20%, rgba(0,0,0,.25), transparent 40%);
}
#lines { position: absolute; inset: 0; width: 3200px; height: 2000px; overflow: visible; }
#lines * { vector-effect: non-scaling-stroke; }
.ink { fill: none; stroke: var(--ink); stroke-width: 1.4; }
.thin { fill: none; stroke: var(--ink2); stroke-width: .8; }
.center { fill: none; stroke: var(--ink2); stroke-width: .8; stroke-dasharray: 18 4 3 4; }
.hidden { fill: none; stroke: var(--ink2); stroke-width: .8; stroke-dasharray: 6 5; }
.redline { fill: none; stroke: var(--red); stroke-width: 1.6; }
.draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 2.2s cubic-bezier(.6,0,.3,1) forwards; animation-delay: var(--d, 0s); }
@keyframes draw { to { stroke-dashoffset: 0; } }
.gear path { fill: rgba(159,220,255,.05); stroke: var(--ink); stroke-width: 1.3; }
.gear circle { fill: none; stroke: var(--ink2); stroke-width: .9; }

.blk { position: absolute; opacity: 0; animation: fadein .9s ease forwards; animation-delay: var(--d, .6s); }
@keyframes fadein { to { opacity: 1; } }
.h { font-weight: 600; letter-spacing: .14em; text-transform: uppercase; font-size: 20px; margin: 0; }
.h small { font-weight: 400; color: var(--ink2); margin-left: 12px; letter-spacing: .1em; font-size: 15px; }
.hand { font-family: var(--hand); color: var(--ink); }
.mono { font-family: var(--mono); }
.box { border: 1.5px solid var(--ink); padding: 18px 20px; background: rgba(15,60,112,.55); }
.balloon { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--ink); font-weight: 700; font-size: 22px; margin-right: 12px; flex: none; }
.dhead { display: flex; align-items: center; border-bottom: 1px solid var(--ink2); padding-bottom: 10px; margin-bottom: 12px; }
.dhead > div > b { display: block; font-size: 15px; letter-spacing: .2em; font-weight: 600; }
.dhead > div > span { display: block; font-size: 13px; color: var(--ink2); letter-spacing: .12em; }
.org { font-size: 30px; font-weight: 600; margin: 0; letter-spacing: .02em; line-height: 1.05; }
.sub { font-size: 16px; margin: 3px 0 0; color: var(--ink2); letter-spacing: .06em; text-transform: uppercase; }
.meta { font-family: var(--mono); font-size: 12px; margin: 6px 0 12px; color: var(--cyan); }
.flow { display: flex; flex-wrap: wrap; gap: 6px 0; margin: 4px 0 14px; align-items: center; }
.flow span { font-family: var(--mono); font-size: 11px; padding: 5px 7px; border: 1px solid var(--ink); white-space: nowrap; }
.flow i { width: 18px; height: 1px; background: var(--ink); position: relative; flex: none; }
.flow i::after { content: ""; position: absolute; right: -1px; top: -3px; border: 3.5px solid transparent; border-left: 6px solid var(--ink); border-right: 0; }
.notes { margin: 0; padding: 0; list-style: none; counter-reset: n; }
.notes li { counter-increment: n; position: relative; padding-left: 26px; font-family: var(--hand); font-size: 14.5px; line-height: 1.5; margin-bottom: 8px; }
.notes li::before { content: counter(n) "."; position: absolute; left: 0; font-family: var(--tech); font-weight: 600; font-size: 15px; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { border: 1px solid var(--ink); padding: 7px 10px; text-align: left; vertical-align: top; }
th { font-weight: 600; letter-spacing: .14em; font-size: 13px; }
td.c { text-align: center; }
a { color: var(--cyan); text-decoration: none; border-bottom: 1px dashed rgba(159,220,255,.6); }
a:hover, a:focus-visible { color: #fff; border-bottom-color: #fff; outline: none; }
.name { font-weight: 700; font-size: 132px; line-height: .86; letter-spacing: .04em; margin: 0; text-transform: uppercase; }
.title-block { display: grid; grid-template-columns: 1.4fr 1fr 1fr; grid-template-rows: repeat(4, 1fr); border: 2px solid var(--ink); background: rgba(15,60,112,.75); }
.title-block > div { border: 1px solid var(--ink); padding: 8px 12px; display: flex; flex-direction: column; justify-content: center; }
.title-block label { font-size: 11px; letter-spacing: .2em; color: var(--ink2); }
.title-block b { font-size: 20px; font-weight: 600; letter-spacing: .06em; }
.gearlabel { position: absolute; transform: translate(-50%, -50%); text-align: center; font-weight: 600; font-size: 17px; letter-spacing: .14em; pointer-events: none; }
.gearlabel small { display: block; font-family: var(--mono); font-size: 11px; color: var(--ink2); letter-spacing: 0; }
.leader { position: absolute; font-family: var(--hand); font-size: 15px; line-height: 1.35; max-width: 230px; }
.zone { position: absolute; font-weight: 600; font-size: 16px; color: var(--ink2); transform: translate(-50%, -50%); }
.tick { position: absolute; transform: translateX(-50%); font-family: var(--mono); font-size: 13px; }
.seglabel { position: absolute; transform: translateX(-50%); text-align: center; font-size: 14px; font-weight: 600; letter-spacing: .08em; white-space: nowrap; }
.seglabel small { display: block; font-family: var(--mono); font-weight: 400; font-size: 11px; color: var(--ink2); letter-spacing: 0; }
button.goto { background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit; cursor: pointer; }
button.goto:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; border-radius: 50%; }

/* HUD */
.hud { position: fixed; z-index: 10; font-family: var(--tech); }
.index { left: max(14px, env(safe-area-inset-left)); top: max(14px, env(safe-area-inset-top)); width: 236px;
  background: rgba(7,28,56,.82); border: 1px solid rgba(233,242,255,.35); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.index header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid rgba(233,242,255,.25); }
.index header b { font-size: 13px; letter-spacing: .26em; }
.index header button { all: unset; cursor: pointer; font-size: 12px; letter-spacing: .1em; color: var(--ink2); }
.index:not(.open) ol, .index:not(.open) p { display: none; }
.index { width: auto !important; }
.index ol { list-style: none; margin: 0; padding: 6px 0; }
.index li button { all: unset; box-sizing: border-box; cursor: pointer; display: flex; gap: 10px; width: 100%; padding: 6px 14px; font-size: 15px; letter-spacing: .06em; color: var(--ink); }
.index li button span { font-family: var(--mono); font-size: 11px; color: var(--cyan); min-width: 28px; padding-top: 3px; }
.index li button:hover, .index li button:focus-visible, .index li button[aria-current="true"] { background: rgba(159,220,255,.12); outline: none; }
.index p { margin: 0; padding: 8px 14px 12px; font-family: var(--hand); font-size: 12.5px; color: var(--ink2); border-top: 1px solid rgba(233,242,255,.2); }
.controls { left: max(14px, env(safe-area-inset-left)); bottom: max(14px, env(safe-area-inset-bottom)); display: flex; gap: 6px; align-items: center; }
.controls button { all: unset; cursor: pointer; width: 34px; height: 34px; display: grid; place-items: center; font-size: 18px;
  background: rgba(7,28,56,.82); border: 1px solid rgba(233,242,255,.35); }
.controls button:hover, .controls button:focus-visible { background: rgba(159,220,255,.18); }
.controls output { font-family: var(--mono); font-size: 11px; color: var(--ink2); padding-left: 8px; white-space: nowrap; }
.tour { left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; align-items: center; gap: 14px; padding: 10px 10px 10px 14px; width: min(640px, calc(100vw - 24px));
  background: rgba(7,28,56,.9); border: 1px solid rgba(233,242,255,.4); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.tour > div { flex: 1; min-width: 0; }
.tour small { display: block; font-family: var(--mono); font-size: 11px; color: var(--cyan); letter-spacing: .1em; }
.tour b { display: block; font-size: 19px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; margin: 2px 0; }
.tour span { display: block; font-family: var(--hand); font-size: 13.5px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tour button { all: unset; cursor: pointer; padding: 10px 14px; border: 1px solid rgba(233,242,255,.4); font-size: 15px; letter-spacing: .08em; }
.tour button.go { background: var(--ink); color: #0a2a50; border-color: var(--ink); font-weight: 600; }
.tour button:hover, .tour button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.controls { bottom: auto !important; top: max(14px, env(safe-area-inset-top)); left: auto !important; right: 110px; }
.cross { position: fixed; pointer-events: none; background: rgba(159,220,255,.35); z-index: 5; display: none; }
.cross.x { left: 0; right: 0; height: 1px; } .cross.y { top: 0; bottom: 0; width: 1px; }
@media (hover: hover) and (pointer: fine) { .cross { display: block; } }
@media (max-width: 700px) {
  .index { width: auto; right: max(14px, env(safe-area-inset-right)); }
  .index header button { display: block; }
  .index:not(.open) ol, .index:not(.open) p { display: none; }
  .controls output { display: none; } .controls { display: none !important; } .tour span { white-space: normal; }
}
@media (prefers-reduced-motion: reduce) {
  .draw { animation: none; stroke-dashoffset: 0; }
  .blk { animation: none; opacity: 1; }
}
</style>
</head>
<body>
<div class="viewport" id="vp">
  <div class="sheet" id="sheet">
    <svg id="lines" viewBox="0 0 3200 2000" aria-hidden="true"></svg>
    <div id="blocks"></div>
  </div>
</div>
<div class="cross x" id="cx"></div><div class="cross y" id="cy"></div>
<nav class="hud index" id="index" aria-label="Drawing index">
  <header><b>DRAWING INDEX</b>&nbsp;&nbsp;<button type="button" id="idxToggle" aria-expanded="false">ALL VIEWS ▾</button></header>
  <ol id="views"></ol>
  <p>Drag to pan · scroll or pinch to zoom · click a balloon to jump to its detail.</p>
</nav>
<div class="hud tour" id="tour" aria-live="polite">
  <button type="button" id="tPrev" aria-label="Previous view">←</button>
  <div><small id="tStep"></small><b id="tName"></b><span id="tSay"></span></div>
  <button type="button" id="tNext" class="go">Next →</button>
</div>
<div class="hud controls">
  <button type="button" id="zin" aria-label="Zoom in">+</button>
  <button type="button" id="zout" aria-label="Zoom out">−</button>
  <button type="button" id="zfit" aria-label="Fit whole sheet">⤢</button>
  <output id="coords">X 0000 · Y 0000</output>
</div>

<script>
(function () {
  const P = window.PORTFOLIO, K = window.Kit, e = K.esc;
  const $ = (s) => document.querySelector(s);
  const reduce = K.reduceMotion;
  const ext = 'target="_blank" rel="noopener noreferrer"';
  const LET = "ABCDEFGH";

  const svg = [];   // svg markup chunks
  const html = [];  // absolutely positioned html blocks
  // Stagger: lines draw in over ~1.8s, blocks fade in over ~1.6s, in authoring order.
  let nl = 0, nb = 0;
  const L = (cls, d, extra = "") => { svg.push(`<path class="${cls} draw" d="${d}" data-li="${nl++}" ${extra}/>`); };
  const B = (x, y, w, inner, cls = "", d) => html.push(`<div class="blk ${cls}" style="left:${x}px;top:${y}px;${w ? `width:${w}px;` : ""}${d != null ? `--d:${d}s` : ""}"${d != null ? "" : ` data-bi="${nb++}"`}>${inner}</div>`);
  const rect = (x, y, w, h) => `M${x} ${y}h${w}v${h}h${-w}Z`;

  /* ---------- Sheet border + zones ---------- */
  L("ink", rect(40, 40, 3120, 1920));
  L("ink", rect(60, 60, 3080, 1880));
  for (let i = 1; i < 8; i++) { const x = 60 + 3080 * i / 8; L("thin", `M${x} 40V60M${x} 1940V1960`); }
  for (let i = 1; i < 6; i++) { const y = 60 + 1880 * i / 6; L("thin", `M40 ${y}H60M3140 ${y}H3160`); }
  for (let i = 0; i < 8; i++) { const x = 60 + 3080 * (i + .5) / 8; html.push(`<span class="zone" style="left:${x}px;top:50px">${8 - i}</span><span class="zone" style="left:${x}px;top:1950px">${8 - i}</span>`); }
  for (let i = 0; i < 6; i++) { const y = 60 + 1880 * (i + .5) / 6; html.push(`<span class="zone" style="left:50px;top:${y}px">${"FEDCBA"[i]}</span><span class="zone" style="left:3150px;top:${y}px">${"FEDCBA"[i]}</span>`); }

  /* ---------- General arrangement: name + skill gears ---------- */
  B(140, 120, 1300, `<p class="h">General arrangement<small>Scale 1:1 · View from front</small></p>`);
  B(140, 170, 1340, `<h1 class="name">${e(P.first)}<br>${e(P.last)}</h1>
    <p class="sub" style="font-size:22px;margin-top:14px;color:var(--cyan)">${e(P.role)} — Assembly GS-26</p>
    <p class="hand" style="font-size:19px;max-width:620px;margin:14px 0 0;line-height:1.45">Description: ${e(P.intro)}</p>`);
  L("thin", "M140 158H1460");

  const MOD = 8.5;
  const gears = P.skills.map((s, i) => ({ s, T: 12 + s.items.length * 3 }));
  gears.forEach((g) => { g.r = g.T * MOD / 2; });
  // place: first gear anchor, others mesh at chosen angles
  gears[0].x = 640; gears[0].y = 760;
  const chain = [[0, 1, -0.32], [1, 2, 0.58], [0, 3, 2.62]];
  chain.forEach(([a, b, th]) => {
    const A = gears[a], Bg = gears[b], d = A.r + Bg.r;
    Bg.x = A.x + Math.cos(th) * d; Bg.y = A.y + Math.sin(th) * d; Bg.parent = a; Bg.theta = th;
  });
  function gearPath(T, r) {
    const ro = r + MOD, rr = r - 1.25 * MOD, step = Math.PI * 2 / T;
    let d = "";
    for (let i = 0; i < T; i++) {
      const a = i * step;
      const pts = [[a - step * .5, rr], [a - step * .3, rr], [a - step * .16, ro], [a + step * .16, ro], [a + step * .3, rr]];
      pts.forEach(([ang, rad], k) => { d += (i === 0 && k === 0 ? "M" : "L") + (Math.cos(ang) * rad).toFixed(1) + " " + (Math.sin(ang) * rad).toFixed(1); });
    }
    return d + "Z";
  }
  gears.forEach((g, i) => {
    const hub = g.r * .26;
    let spokes = "";
    for (let k = 0; k < 5; k++) { const a = k * Math.PI * 2 / 5; spokes += `<line x1="${Math.cos(a) * hub}" y1="${Math.sin(a) * hub}" x2="${Math.cos(a) * (g.r - 2 * MOD)}" y2="${Math.sin(a) * (g.r - 2 * MOD)}" stroke="var(--ink2)" stroke-width=".9"/>`; }
    svg.push(`<g class="gear" transform="translate(${g.x} ${g.y})"><g id="gear${i}"><path d="${gearPath(g.T, g.r)}"/><circle r="${g.r - 2 * MOD}"/><circle r="${hub}"/><circle r="${hub * .4}"/>${spokes}</g></g>`);
    L("center", `M${g.x - g.r - 30} ${g.y}H${g.x + g.r + 30}M${g.x} ${g.y - g.r - 30}V${g.y + g.r + 30}`);
    html.push(`<div class="gearlabel blk" style="left:${g.x}px;top:${g.y}px;--d:1.2s">${e(g.s.group.toUpperCase())}<small>${g.T}T · M${MOD}</small></div>`);
  });
  // leader notes for each gear
  const leaderPos = [[150, 640, -1], [1180, 470, 1], [1200, 820, 1], [150, 900, -1]];
  gears.forEach((g, i) => {
    const [lx, ly, side] = leaderPos[i];
    const ex = side < 0 ? lx + 220 : lx - 10, ey = ly + 14;
    const ang = Math.atan2(ey - g.y, ex - g.x), px = g.x + Math.cos(ang) * (g.r + MOD), py = g.y + Math.sin(ang) * (g.r + MOD);
    L("thin", `M${px} ${py}L${ex} ${ey}`);
    svg.push(`<circle cx="${px}" cy="${py}" r="3" fill="var(--ink)"/>`);
    B(side < 0 ? lx : lx, ly, 230, `<div class="leader" style="position:static"><b style="font-family:var(--tech);letter-spacing:.12em">${e(g.s.group.toUpperCase())}</b><br>${e(g.s.items.join(", "))}</div>`);
  });

  /* ---------- General notes (principles) ---------- */
  B(1560, 120, 640, `<p class="h">General notes</p>
    <ol class="notes" style="margin-top:14px">${P.principles.map((x) => `<li style="font-size:21px">${e(x)}</li>`).join("")}
    <li>All dimensions in years unless otherwise specified.</li></ol>`);

  /* ---------- Revision table ---------- */
  const revs = [
    ...P.experience.map((x) => ({ t: x.start, desc: `${x.role} — ${x.orgShort}${x.team ? " · " + x.team : ""}`, date: x.dates, id: x.id })),
    ...P.education.map((d) => ({ t: d.id === "cu" ? 2027.4 : 2024.5, desc: `${d.degree} — ${d.schoolShort}`, date: d.dates, id: d.id })),
  ].sort((a, b) => a.t - b.t);
  B(2260, 80, 880, `<table><caption class="h" style="text-align:left;padding-bottom:8px">Revisions</caption>
    <thead><tr><th>REV</th><th>DESCRIPTION</th><th>DATE</th><th>APP'D</th></tr></thead>
    <tbody>${revs.map((r, i) => `<tr${P.experience[0].id === r.id ? ' id="currev"' : ""}><td class="c"><b>${LET[i]}</b></td><td>${e(r.desc)}</td><td class="mono" style="font-size:12px;white-space:nowrap">${e(r.date)}</td><td class="c hand">${/expected/i.test(r.date) ? "pending" : "GS"}</td></tr>`).join("")}</tbody></table>`);
  // revision cloud around the current revision row (approx position)
  const cloud = (x, y, w, h, r = 14) => {
    let d = `M${x} ${y}`;
    for (let i = 0; i < w; i += r * 2) d += `a${r} ${r} 0 0 1 ${Math.min(r * 2, w - i)} 0`;
    for (let i = 0; i < h; i += r * 2) d += `a${r} ${r} 0 0 1 0 ${Math.min(r * 2, h - i)}`;
    for (let i = 0; i < w; i += r * 2) d += `a${r} ${r} 0 0 1 ${-Math.min(r * 2, w - i)} 0`;
    for (let i = 0; i < h; i += r * 2) d += `a${r} ${r} 0 0 1 0 ${-Math.min(r * 2, h - i)}`;
    return d;
  };

  /* ---------- Details A–D (experience) ---------- */
  const DX = 1560, DY = 400, DW = 380, DH = 620, DG = 13;
  P.experience.forEach((x, i) => {
    const bx = DX + i * (DW + DG);
    B(bx, DY, DW, `<div class="box" id="det-${i}" style="height:${DH}px;overflow:hidden">
      <div class="dhead"><span class="balloon">${LET[i]}</span><div><b>DETAIL ${LET[i]}</b><span>SCALE 2:1 · ${e(x.location.toUpperCase())}</span></div></div>
      <p class="org">${e(x.org)}</p>
      <p class="sub">${e(x.role)}${x.team ? " · " + e(x.team) : ""}</p>
      <p class="meta">${e(x.dates.toUpperCase())}${x.current ? " · IN SERVICE" : ""}</p>
      <div class="flow">${(x.flow || []).map((f) => `<span>${e(f)}</span>`).join("<i></i>")}</div>
      <ol class="notes">${x.bullets.map((b) => `<li>${e(b)}</li>`).join("")}</ol>
      ${x.link ? `<p class="mono" style="font-size:12px;margin:4px 0 0">REF: <a href="${e(x.link.href)}" ${ext}>${e(x.link.label)} ↗</a></p>` : ""}
    </div>`);
    if (x.current) svg.push(`<path class="redline draw" style="--d:2.6s;--len:4000" d="${cloud(bx - 16, DY - 16, DW + 32, 70)}"/>`);
  });
  if (P.experience[0].current) B(DX + 10, DY - 54, 300, `<span class="hand" style="color:var(--red);font-size:16px">current revision — in progress</span>`, "", 2.8);

  /* ---------- Career shaft (timeline) ---------- */
  const T0 = 2023, T1 = 2027.5, SX0 = 200, SX1 = 1940, SY = 1185;
  const tx = (t) => SX0 + (SX1 - SX0) * (t - T0) / (T1 - T0);
  B(140, SY + 108, 560, `<p class="h">Section X–X · Career shaft<small>All dimensions in years</small></p>`);
  L("ink", `M${SX0} ${SY - 16}H${SX1}M${SX0} ${SY + 16}H${SX1}`);
  L("ink", `M${SX0} ${SY - 16}V${SY + 16}M${SX1} ${SY - 16}V${SY + 16}`);
  L("center", `M${SX0 - 40} ${SY}H${SX1 + 40}`);
  for (let y = T0; y <= 2027; y++) {
    const x = tx(y);
    L("thin", `M${x} ${SY + 30}V${SY + 70}`);
    html.push(`<span class="tick blk" style="left:${x}px;top:${SY + 74}px">${y}</span>`);
  }
  L("thin", `M${SX0} ${SY + 50}H${SX1}`);
  svg.push(`<path d="M${SX0} ${SY + 50}l10 -4v8z M${SX1} ${SY + 50}l-10 -4v8z" fill="var(--ink)"/>`);
  P.experience.forEach((x, i) => {
    const a = tx(x.start), b = Math.max(tx(x.end), a + 34);
    L("ink", rect(a, SY - 34, b - a, 68));
    svg.push(`<path d="${rect(a, SY - 34, b - a, 68)}" fill="rgba(159,220,255,.12)"/>`);
    L("hidden", `M${a} ${SY - 34}L${b} ${SY + 34}M${b} ${SY - 34}L${a} ${SY + 34}`);
    const mid = (a + b) / 2, lvl = i % 2, by = SY - 92 - lvl * 70, off = (i % 2 ? -1 : 1) * 26;
    L("thin", `M${mid} ${SY - 34}L${mid + off} ${by + 22}`);
    html.push(`<button class="goto blk" data-view="det${i}" aria-label="Detail ${LET[i]}: ${e(x.org)}" style="left:${mid + off - 22}px;top:${by - 22}px;--d:1.4s"><span class="balloon" style="background:var(--paper)">${LET[i]}</span></button>`);
    html.push(`<span class="seglabel blk" style="left:${mid + off + (off > 0 ? 34 : -34)}px;top:${by - 14}px;transform:translateX(${off > 0 ? "0" : "-100%"});text-align:${off > 0 ? "left" : "right"}">${e(x.orgShort)}<small>${e(x.dates)}</small></span>`);
  });
  P.education.forEach((d) => {
    const t = d.id === "cu" ? 2027.4 : 2024.5, x = tx(t);
    L("ink", rect(x - 7, SY - 24, 14, 48));
    html.push(`<span class="seglabel blk" style="left:${x}px;top:${SY + 104}px">${e(d.schoolShort)}<small>${e(d.degree.split(" (")[0])}</small></span>`);
  });

  /* ---------- Projects ---------- */
  B(140, 1360, 900, `<p class="h">Sections P1–P4 · Works in progress</p>`);
  P.projects.forEach((p, i) => {
    const x = 140 + i * 465;
    B(x, 1404, 450, `<div class="box" id="proj-${i}" style="height:510px">
      <div class="dhead"><span class="balloon" style="font-size:16px">P${i + 1}</span><div><b>SECTION P${i + 1}–P${i + 1}</b><span>${e(p.status.toUpperCase())}</span></div></div>
      <p class="org">${e(p.name)}</p>
      <p class="sub" style="text-transform:none;letter-spacing:.02em">${e(p.tagline)}</p>
      <div class="flow" style="margin-top:14px">${(p.flow || []).map((f) => `<span>${e(f)}</span>`).join("<i></i>")}</div>
      <p class="hand" style="font-size:15px;line-height:1.5;margin:0 0 12px">${e(p.desc)}</p>
      <p class="mono" style="font-size:12px;margin:0 0 6px;color:var(--ink2)">MATERIAL: ${e(p.tags.join(" / "))}</p>
      <p class="mono" style="font-size:12px;margin:0">REF: <a href="${e(p.url)}" ${ext}>${e(p.url.replace("https://", ""))} ↗</a></p>
    </div>`);
  });

  /* ---------- Bill of materials (skills) ---------- */
  B(2060, 1080, 1080, `<table><caption class="h" style="text-align:left;padding-bottom:8px">Bill of materials</caption>
    <thead><tr><th>ITEM</th><th>QTY</th><th>PART</th><th>SPECIFICATION</th></tr></thead>
    <tbody>${P.skills.map((s, i) => `<tr><td class="c">${i + 1}</td><td class="c mono">${s.items.length}</td><td><b>${e(s.group.toUpperCase())}</b></td><td>${e(s.items.join(", "))}</td></tr>`).join("")}</tbody></table>`);

  /* ---------- Certifications (education) ---------- */
  B(2060, 1420, 1080, `<table><caption class="h" style="text-align:left;padding-bottom:8px">Material certifications</caption>
    <tbody>${P.education.map((d) => `<tr><td><b>${e(d.degree)}</b><br><span style="color:var(--ink2)">${e(d.school)} · ${e(d.location)}</span></td><td class="mono" style="font-size:12px;white-space:nowrap">${e(d.dates.toUpperCase())}</td><td class="mono" style="white-space:nowrap">GPA ${e(d.gpa)}</td></tr>`).join("")}</tbody></table>`);

  /* ---------- Title block (contact) ---------- */
  const today = new Date();
  B(2060, 1640, 1080, `<div class="title-block" id="tblock" style="height:300px">
    <div style="grid-row:span 2"><label>TITLE</label><b style="font-size:30px;line-height:1">${e(P.name.toUpperCase())}</b><span style="letter-spacing:.14em;color:var(--cyan)">${e(P.role.toUpperCase())}</span></div>
    <div><label>DWG NO.</label><b>GS-26</b></div><div><label>REV</label><b>${LET[revs.length - 2] || "E"}</b></div>
    <div><label>SCALE</label><b>1 : 1</b></div><div><label>SHEET</label><b>1 OF 1</b></div>
    ${P.contacts.map((c, i) => `<div${i === 0 ? ' style="grid-column:span 1"' : ""}><label>${e(c.label.toUpperCase())}</label><a href="${e(c.href)}" ${c.id === "email" ? "" : ext} style="font-size:15px;align-self:flex-start">${e(c.handle)}</a></div>`).join("")}
    <div><label>DRAWN · DATE</label><b style="font-size:16px">G. SHATALIN · ${String(today.getMonth() + 1).padStart(2, "0")}/${today.getFullYear()}</b></div>
  </div>`);

  /* ---------- Mount ---------- */
  const sheet = $("#sheet");
  $("#lines").innerHTML = svg.join("");
  $("#blocks").innerHTML = html.join("");
  sheet.querySelectorAll("[data-li]").forEach((el) => el.style.setProperty("--d", (el.dataset.li * 1.8 / nl).toFixed(3) + "s"));
  sheet.querySelectorAll("[data-bi]").forEach((el) => el.style.setProperty("--d", (0.5 + el.dataset.bi * 1.6 / nb).toFixed(3) + "s"));
  document.querySelectorAll("#lines .draw").forEach((p) => { if (!p.style.getPropertyValue("--len")) { try { p.style.setProperty("--len", Math.ceil(p.getTotalLength()) + 1); } catch (_) { p.style.setProperty("--len", 4000); } } });

  /* ---------- Gears turn (meshed) ---------- */
  const gEls = gears.map((g, i) => document.getElementById("gear" + i));
  function meshAngles(phi0) {
    const phi = [phi0];
    chain.forEach(([a, b, th]) => {
      const A = gears[a], Bg = gears[b];
      const pA = (((th - phi[a]) * A.T / (2 * Math.PI)) % 1 + 1) % 1;
      phi[b] = th + Math.PI - 2 * Math.PI * (0.5 - pA) / Bg.T;
    });
    return phi;
  }
  let phi0 = 0;
  function spin(t) {
    phi0 = reduce ? 0 : t * 0.00012;
    const phi = meshAngles(phi0);
    gEls.forEach((el, i) => el.setAttribute("transform", `rotate(${(phi[i] * 180 / Math.PI).toFixed(3)})`));
    if (!reduce) requestAnimationFrame(spin);
  }
  requestAnimationFrame(spin);

  /* ---------- Camera ---------- */
  const vp = $("#vp");
  const cam = { x: 0, y: 0, s: 1 };
  const SW = 3200, SH = 2000;
  const apply = () => { sheet.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.s})`; };
  const clampS = (s) => Math.max(Math.min(innerWidth / SW, innerHeight / SH) * 0.6, Math.min(3, s));
  const inset = () => 0;
  function fitRect(x, y, w, h, pad = 0.9) {
    const aw = innerWidth - inset(), ah = innerHeight - 170;
    const s = clampS(Math.min(aw / w, ah / h) * pad);
    return { s, x: inset() + aw / 2 - (x + w / 2) * s, y: 60 + ah / 2 - (y + h / 2) * s };
  }
  let anim = null;
  function flyTo(t, ms = 1100) {
    cancelAnimationFrame(anim);
    if (reduce) { Object.assign(cam, t); apply(); return; }
    const a = { ...cam }, t0 = performance.now();
    // zoom out a little mid-flight for a "camera move" feel
    const dip = Math.min(a.s, t.s) * 0.7;
    const step = (now) => {
      const k = Math.min(1, (now - t0) / ms), q = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      const sMid = a.s + (t.s - a.s) * q, bump = Math.sin(Math.PI * k) * Math.max(0, Math.min(sMid, a.s) - dip) * 0.6;
      const s = sMid - bump;
      // keep the interpolated sheet point centered
      const cxA = (innerWidth / 2 - a.x) / a.s, cyA = (innerHeight / 2 - a.y) / a.s;
      const cxT = (innerWidth / 2 - t.x) / t.s, cyT = (innerHeight / 2 - t.y) / t.s;
      const cx = cxA + (cxT - cxA) * q, cy = cyA + (cyT - cyA) * q;
      cam.s = s; cam.x = innerWidth / 2 - cx * s; cam.y = innerHeight / 2 - cy * s;
      apply();
      if (k < 1) anim = requestAnimationFrame(step);
    };
    anim = requestAnimationFrame(step);
  }

  const VIEWS = [
    { id: "all", n: "01", name: "Full sheet", r: [0, 0, SW, SH], pad: .96 },
    { id: "ga", n: "02", name: "General arrangement", r: [120, 100, 1400, 960], rn: [120, 100, 800, 420] },
    { id: "notes", n: "03", name: "General notes", r: [1540, 100, 700, 300] },
    { id: "revs", n: "04", name: "Revision history", r: [2240, 60, 920, 340] },
    { id: "det", n: "05", name: "Details A–D · Experience", r: [1540, 330, 1600, 710] },
    ...P.experience.map((x, i) => ({ id: "det" + i, n: "05" + LET[i].toLowerCase(), name: `Detail ${LET[i]} · ${x.orgShort}`, r: [1560 + i * (DW + DG) - 20, DY - 70, DW + 40, DH + 90], sub: true })),
    { id: "shaft", n: "06", name: "Career shaft", r: [120, 1000, 1900, 350] },
    { id: "proj", n: "07", name: "Sections P1–P4 · Projects", r: [120, 1350, 1880, 580] },
    { id: "bom", n: "08", name: "Bill of materials · Skills", r: [2040, 1060, 1120, 560] },
    { id: "title", n: "09", name: "Title block · Contact", r: [2040, 1620, 1120, 330] },
  ];
  $("#views").innerHTML = VIEWS.map((v) => `<li${v.sub ? ' style="padding-left:16px"' : ""}><button type="button" data-view="${v.id}"><span>${v.n}</span>${e(v.name)}</button></li>`).join("");
  const TOUR = [
    ["ga", "Start here: who this drawing describes. The gears are skill groups."],
    ...P.experience.map((x, i) => ["det" + i, x.summary]),
    ["proj", "Four side projects, each with its own section."],
    ["bom", "Every tool in the build, by part number."],
    ["title", "Signed by the engineer. Contact details live here."],
  ];
  let tourI = 0;
  function tourShow(i) {
    tourI = (i + TOUR.length) % TOUR.length;
    const [id, say] = TOUR[tourI], v = VIEWS.find((x) => x.id === id);
    $("#tStep").textContent = `VIEW ${String(tourI + 1).padStart(2, "0")} / ${String(TOUR.length).padStart(2, "0")}`;
    $("#tName").textContent = v.name.replace(/^Sections? /, "");
    $("#tSay").textContent = say;
    $("#tNext").textContent = tourI === TOUR.length - 1 ? "Start over ↺" : "Next →";
    view(id, true);
  }
  $("#tPrev").onclick = () => tourShow(tourI - 1);
  $("#tNext").onclick = () => tourShow(tourI + 1);
  let curView = null;
  function view(id, fromTour) {
    if (!fromTour) { const k = TOUR.findIndex((t) => t[0] === id); if (k >= 0) { tourShow(k); return; } }
    const v = VIEWS.find((x) => x.id === id); if (!v) return;
    curView = id;
    document.querySelectorAll("#views button").forEach((b) => b.setAttribute("aria-current", String(b.dataset.view === id)));
    flyTo(fitRect(...(innerWidth < 700 && v.rn ? v.rn : v.r), v.pad || .9));
    $("#index").classList.remove("open"); $("#idxToggle").setAttribute("aria-expanded", "false");
  }
  $("#idxToggle").onclick = () => { const o = $("#index").classList.toggle("open"); $("#idxToggle").setAttribute("aria-expanded", String(o)); };

  // pan / pinch / wheel
  const ptrs = new Map();
  let dragging = false, moved = 0, pinch = null, last = null;
  vp.addEventListener("pointerdown", (ev) => {
    ptrs.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    moved = 0; last = { x: ev.clientX, y: ev.clientY };
    cancelAnimationFrame(anim);
    if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()];
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), s: cam.s, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, x: cam.x, y: cam.y };
    }
  });
  addEventListener("pointermove", (ev) => {
    $("#cx").style.top = ev.clientY + "px"; $("#cy").style.left = ev.clientX + "px";
    const sx = (ev.clientX - cam.x) / cam.s, sy = (ev.clientY - cam.y) / cam.s;
    $("#coords").textContent = `X ${String(Math.round(sx)).padStart(4, "0")} · Y ${String(Math.round(SH - sy)).padStart(4, "0")} · ${Math.round(cam.s * 100)}%`;
    if (!ptrs.has(ev.pointerId)) return;
    ptrs.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (ptrs.size === 2 && pinch) {
      const [a, b] = [...ptrs.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const s = clampS(pinch.s * d / pinch.d);
      cam.s = s;
      cam.x = mx - (pinch.mx - pinch.x) * (s / pinch.s);
      cam.y = my - (pinch.my - pinch.y) * (s / pinch.s);
      moved = 99; apply(); return;
    }
    const dx = ev.clientX - last.x, dy = ev.clientY - last.y; last = { x: ev.clientX, y: ev.clientY };
    moved += Math.abs(dx) + Math.abs(dy);
    if (moved > 5) {
      if (!dragging) { dragging = true; vp.classList.add("drag"); try { vp.setPointerCapture(ev.pointerId); } catch (_) {} }
      cam.x += dx; cam.y += dy; apply();
    }
  });
  const up = (ev) => { ptrs.delete(ev.pointerId); if (ptrs.size < 2) pinch = null; if (!ptrs.size) { dragging = false; vp.classList.remove("drag"); } };
  addEventListener("pointerup", up); addEventListener("pointercancel", up);
  vp.addEventListener("click", (ev) => { if (moved > 5) { ev.preventDefault(); ev.stopPropagation(); } }, true);

  function zoomAt(f, mx, my) {
    const s = clampS(cam.s * f);
    cam.x = mx - (mx - cam.x) * (s / cam.s); cam.y = my - (my - cam.y) * (s / cam.s); cam.s = s; apply();
  }
  vp.addEventListener("wheel", (ev) => {
    ev.preventDefault(); cancelAnimationFrame(anim);
    const mouseWheel = ev.deltaMode === 1 || (Math.abs(ev.deltaY) >= 40 && ev.deltaX === 0 && Number.isInteger(ev.deltaY));
    if (ev.ctrlKey || mouseWheel) zoomAt(Math.exp(-ev.deltaY * (ev.ctrlKey ? 0.01 : 0.0015)), ev.clientX, ev.clientY);
    else { cam.x -= ev.deltaX; cam.y -= ev.deltaY; apply(); }
  }, { passive: false });
  vp.addEventListener("dblclick", (ev) => zoomAt(1.8, ev.clientX, ev.clientY));

  document.addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-view]"); if (b) view(b.dataset.view);
  });
  $("#zin").onclick = () => zoomAt(1.4, innerWidth / 2, innerHeight / 2);
  $("#zout").onclick = () => zoomAt(1 / 1.4, innerWidth / 2, innerHeight / 2);
  $("#zfit").onclick = () => view("all");
  addEventListener("keydown", (ev) => {
    if (ev.key === "+" || ev.key === "=") zoomAt(1.25, innerWidth / 2, innerHeight / 2);
    else if (ev.key === "-") zoomAt(.8, innerWidth / 2, innerHeight / 2);
    else if (ev.key === "0") view("all");
    else if (ev.key === "ArrowRight") tourShow(tourI + 1);
    else if (ev.key === "ArrowLeft") tourShow(tourI - 1);
    else if (ev.key.startsWith("Arrow")) {
      const d = 80; cam.x += ev.key === "ArrowLeft" ? d : ev.key === "ArrowRight" ? -d : 0; cam.y += ev.key === "ArrowUp" ? d : ev.key === "ArrowDown" ? -d : 0; apply();
    }
  });
  // keyboard focus inside the sheet → bring it into view
  sheet.addEventListener("focusin", (ev) => {
    const r = ev.target.getBoundingClientRect();
    if (r.left < 0 || r.top < 0 || r.right > innerWidth || r.bottom > innerHeight) {
      cam.x += innerWidth / 2 - (r.left + r.width / 2); cam.y += innerHeight / 2 - (r.top + r.height / 2); apply();
    }
  });

  // initial camera: whole sheet, then glide into the general arrangement on small screens
  Object.assign(cam, fitRect(0, 0, SW, SH, .96)); apply();
  const hv = location.hash.match(/view=([\w]+)/);
  if (hv) { const v = VIEWS.find((x) => x.id === hv[1]); if (v) { Object.assign(cam, fitRect(...v.r, v.pad || .9)); apply(); } }
  else setTimeout(() => tourShow(0), K.reduceMotion ? 0 : 1600);
  if (hv) { const k = TOUR.findIndex((t) => t[0] === hv[1]); if (k >= 0) { tourI = k; $("#tStep").textContent = `VIEW ${String(k + 1).padStart(2, "0")} / ${String(TOUR.length).padStart(2, "0")}`; $("#tName").textContent = VIEWS.find((x) => x.id === hv[1]).name; $("#tSay").textContent = TOUR[k][1]; } }
  let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (curView) view(curView); }, 150); });
})();
</script>
</body>
</html>
