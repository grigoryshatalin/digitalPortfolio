<!DOCTYPE html>
<html lang="en" data-world="abyss" data-switcher="bl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Descent — Grigory Shatalin</title>
<meta name="description" content="Grigory Shatalin, software engineer — a dive from the surface to the sea floor." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Martian+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="../../shared/data.js"></script>
<script src="../../shared/kit.js"></script>
<style>
:root { --glow: #7ff3ff; --serif: "Instrument Serif", Georgia, serif; --mono: "Martian Mono", ui-monospace, monospace; }
* { box-sizing: border-box; }
html { background: #01060f; scroll-behavior: auto; }
body { margin: 0; color: #e6f7ff; font-family: var(--mono); font-weight: 300; -webkit-font-smoothing: antialiased; }
#sea { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
main { position: relative; z-index: 2; }
.hero { height: 100vh; height: 100svh; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 20px; padding-bottom: 30vh; }
.hero .eyebrow { font-size: 11px; letter-spacing: .5em; text-transform: uppercase; color: #fff; opacity: .85; margin: 0 0 16px; text-shadow: 0 1px 12px rgba(0,40,80,.5); }
.hero h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(56px, 12vw, 168px); line-height: .86; margin: 0; color: #fff; text-shadow: 0 4px 40px rgba(0,30,60,.35); letter-spacing: -.02em; }
.hero h1 em { font-style: italic; }
.hero p.sub { max-width: 40ch; margin: 22px auto 0; font-size: 13px; line-height: 1.7; color: #f2fbff; text-shadow: 0 1px 10px rgba(0,30,60,.6); }
.dive { margin-top: 30px; display: inline-flex; flex-direction: column; align-items: center; gap: 10px; color: #fff; text-decoration: none; font-size: 11px; letter-spacing: .4em; text-transform: uppercase; }
.dive span { width: 1px; height: 46px; background: linear-gradient(#fff, transparent); animation: drip 2.2s ease-in-out infinite; transform-origin: top; }
@keyframes drip { 0% { transform: scaleY(0); } 50% { transform: scaleY(1); } 100% { transform: scaleY(1); opacity: 0; } }

.station { position: absolute; left: 0; right: 0; display: flex; padding: 0 clamp(16px, 8vw, 140px); pointer-events: none; }
.station.r { justify-content: flex-end; }
.panel {
  pointer-events: auto; width: min(420px, 100%); padding: 0 0 0 22px; position: relative;
}
.panel::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 1px; background: linear-gradient(var(--glow), transparent); transform: scaleY(0); transform-origin: top; transition: transform 1.4s cubic-bezier(.2,.7,.2,1); }
.panel.seen::before { transform: scaleY(1); }
.panel > * { opacity: 0; transform: translateY(18px); filter: blur(6px); transition: opacity .9s ease, transform 1.1s cubic-bezier(.2,.7,.2,1), filter .9s ease; }
.panel.seen > * { opacity: 1; transform: none; filter: none; }
.panel.seen > *:nth-child(2) { transition-delay: .12s; } .panel.seen > *:nth-child(3) { transition-delay: .24s; } .panel.seen > *:nth-child(4) { transition-delay: .36s; } .panel.seen > *:nth-child(5) { transition-delay: .48s; }
.tag { display: block; font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--glow); opacity: .85; margin: 0 0 14px; }
.panel h2 { font-family: var(--serif); font-weight: 400; font-size: clamp(32px, 4.2vw, 46px); line-height: 1; margin: 0 0 6px; color: #fff; }
.panel h2 em { font-style: italic; }
.panel .role { margin: 0 0 4px; font-size: 12px; color: #bfe9ff; line-height: 1.6; }
.panel .when { margin: 0 0 14px; font-size: 11px; color: rgba(191,233,255,.6); }
.panel p, .panel li { font-size: 14px; line-height: 1.7; color: #d8f1ff; text-shadow: 0 1px 12px rgba(0,10,25,.9); }
.panel h2 { text-shadow: 0 2px 30px rgba(0,10,25,.9); }
.links small { color: #9fc7da; font-size: 11.5px; }
.panel ul { margin: 0; padding-left: 16px; }
.panel li { margin-bottom: 8px; }
.panel li::marker { color: var(--glow); }
.panel a { color: var(--glow); text-decoration: none; border-bottom: 1px solid rgba(127,243,255,.4); }
.panel a:hover, .panel a:focus-visible { border-color: var(--glow); outline: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.chips span { font-size: 10px; padding: 4px 9px; border-radius: 99px; border: 1px solid rgba(127,243,255,.3); color: #bfe9ff; }
.jar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
.jar div { padding: 12px; border-radius: 12px 12px 18px 18px; border: 1px solid rgba(127,243,255,.25); background: radial-gradient(ellipse at 50% 100%, rgba(127,243,255,.14), transparent 70%); }
.jar b { display: block; font-family: var(--serif); font-weight: 400; font-size: 22px; color: #fff; margin-bottom: 4px; }
.jar span { font-size: 11px; line-height: 1.6; color: #bfe9ff; }
.links { display: grid; gap: 8px; margin: 10px 0 0; padding: 0; list-style: none; }
.links a { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(127,243,255,.25); font-size: 12px; }
.links a:hover, .links a:focus-visible { background: rgba(127,243,255,.08); }
.resurface { all: unset; cursor: pointer; margin-top: 18px; display: inline-block; font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--glow); }

/* Depth gauge */
.gauge { position: fixed; z-index: 5; right: max(14px, env(safe-area-inset-right)); top: 50%; transform: translateY(-50%); height: min(70vh, 560px); display: flex; gap: 12px; align-items: stretch; pointer-events: none; transition: opacity .6s; }
.gauge.hide { opacity: 0; }
.readout { align-self: center; text-align: right; font-size: 10px; letter-spacing: .14em; color: rgba(230,247,255,.7); text-transform: uppercase; line-height: 1.7; }
.readout b { display: block; font-family: var(--serif); font-weight: 400; font-size: 34px; letter-spacing: 0; color: #fff; text-transform: none; line-height: 1; margin-bottom: 4px; }
.track { position: relative; width: 2px; background: rgba(230,247,255,.2); border-radius: 2px; pointer-events: auto; }
.track .fill { position: absolute; left: 0; top: 0; width: 100%; background: var(--glow); box-shadow: 0 0 10px var(--glow); border-radius: 2px; }
.track button { all: unset; position: absolute; left: -5px; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; cursor: pointer; background: #01060f; border: 1px solid rgba(127,243,255,.6); }
.track button:hover, .track button:focus-visible { background: var(--glow); }
.track button::after { content: attr(data-label); position: absolute; right: 20px; top: 50%; transform: translateY(-50%); white-space: nowrap; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #e6f7ff; opacity: 0; transition: opacity .2s; pointer-events: none; }
.track button:hover::after, .track button:focus-visible::after { opacity: 1; }
@media (max-width: 700px) {
  .station, .station.r { justify-content: center; padding: 0 16px; }
  .gauge { top: auto; bottom: max(14px, env(safe-area-inset-bottom)); transform: none; height: auto; right: 14px; }
  .track { display: none; }
  .readout b { font-size: 24px; }
  .readout { background: rgba(1,6,15,.6); padding: 8px 10px; border-radius: 10px; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .panel { padding-left: 18px; }
}
@media (prefers-reduced-motion: reduce) { .panel, .panel > *, .panel::before { transition: none !important; } .dive span { animation: none; } }
</style>
</head>
<body>
<canvas id="sea" aria-hidden="true"></canvas>
<main id="main">
  <header class="hero">
    <p class="eyebrow">Descent · An expedition log</p>
    <h1>Grigory<br><em>Shatalin</em></h1>
    <p class="sub" id="heroSub"></p>
    <a class="dive" href="#s-about" id="diveBtn">Begin the dive<span></span></a>
  </header>
</main>
<aside class="gauge hide" id="gauge" aria-label="Depth gauge">
  <div class="readout" aria-live="off"><b id="depth">0 m</b><span id="zone">Surface</span><span id="temp" hidden></span></div>
  <div class="track" id="track"><div class="fill" id="fill"></div></div>
</aside>

<script>
(function () {
  const P = window.PORTFOLIO, K = window.Kit, e = K.esc;
  const $ = (s) => document.querySelector(s);
  const reduce = K.reduceMotion;
  const ext = 'target="_blank" rel="noopener noreferrer"';
  const fmt = (m) => Math.round(m).toLocaleString("en-US") + " m";
  $("#heroSub").textContent = `${P.role} · ${P.location}. Scroll to descend — the deeper you go, the further the log reaches.`;

  /* ---------------- Stations ---------------- */
  const MAX_DEPTH = 4200;
  const ZONES = [[0, "Sunlight zone"], [200, "Twilight zone"], [1000, "Midnight zone"], [4000, "Abyssal plain"]];
  const zoneAt = (d) => d < 4 ? "Surface" : ZONES.filter(([z]) => d >= z).pop()[1];
  const GLOWS = ["#7ff3ff", "#ff7ad9", "#b48cff", "#ffc36b"];
  const S = [];
  // One idea per stop: a title, one line, and the tools.
  S.push({ id: "about", label: "About", depth: 140, html: `
    <p class="tag">${fmt(140)} · About</p>
    <h2>Hello from <em>the shallows</em></h2>
    <p>${e(P.intro)}</p>
    <div class="chips">${P.principles.map((x) => `<span>${e(x)}</span>`).join("")}</div>` });
  P.experience.forEach((x, i) => S.push({ id: "exp-" + x.id, label: x.orgShort, depth: 380 + i * 220, creature: "jelly", glow: GLOWS[i % 4], html: `
    <p class="tag">${fmt(380 + i * 220)} · ${x.current ? "Now" : "Experience"}</p>
    <h2>${e(x.org)}</h2>
    <p class="when">${e(x.role)}${x.team ? " · " + e(x.team) : ""} · ${e(x.dates)}</p>
    <p>${e(x.summary)}</p>
    <div class="chips">${x.tags.map((t) => `<span>${e(t)}</span>`).join("")}</div>` }));
  S.push({ id: "projects", label: "Projects", depth: 1500, creature: "angler", glow: "#9dffb0", html: `
    <p class="tag">${fmt(1500)} · Projects</p>
    <h2>Lights <em>in the dark</em></h2>
    <ul class="links">${P.projects.map((p) => `<li><a href="${e(p.url)}" ${ext}><span><b>${e(p.name)}</b><br><small>${e(p.tagline)}</small></span><span>↗</span></a></li>`).join("")}</ul>` });
  S.push({ id: "education", label: "Education", depth: 2600, creature: "core", html: `
    <p class="tag">${fmt(2600)} · Education</p>
    <h2>${e(P.education[0].school)}</h2>
    <p class="when">${e(P.education[0].degree)} · ${e(P.education[0].dates)} · GPA ${e(P.education[0].gpa)}</p>
    ${P.education.slice(1).map((d) => `<p>Before that: ${e(d.degree)}, ${e(d.school)} — GPA ${e(d.gpa)}.</p>`).join("")}` });
  S.push({ id: "skills", label: "Skills", depth: 3400, creature: "vent", html: `
    <p class="tag">${fmt(3400)} · Skills</p>
    <h2>What lives <em>down here</em></h2>
    <div class="chips">${P.skills.flatMap((s) => s.items).map((t) => `<span>${e(t)}</span>`).join("")}</div>` });
  S.push({ id: "contact", label: "Sea floor", depth: 4150, creature: "beacon", html: `
    <p class="tag">${fmt(MAX_DEPTH)} · Sea floor</p>
    <h2>Send a <em>signal</em> up</h2>
    <ul class="links">${P.contacts.map((c) => `<li><a href="${e(c.href)}" ${c.id === "email" ? "" : ext}><span>${e(c.label)}</span><span>${e(c.handle)}</span></a></li>`).join("")}</ul>
    <button class="resurface" id="resurface" type="button">↑ Resurface</button>` });

  const main = $("#main");
  S.forEach((s, i) => {
    const el = document.createElement("section");
    el.className = "station" + (i % 2 ? " r" : ""); el.id = "s-" + s.id;
    el.setAttribute("aria-label", s.label);
    el.innerHTML = `<article class="panel" style="--glow:${s.glow || "#7ff3ff"}">${s.html}</article>`;
    main.appendChild(el); s.el = el; s.side = i % 2 ? 1 : -1;
  });

  /* ---------------- Depth ↔ page geometry ---------------- */
  let W, H, DPR, total, PPM; // pixels per metre
  const surfaceY = () => H * 0.62;           // waterline in world px (first screen)
  const yOf = (d) => surfaceY() + d * PPM;   // world y of a depth
  const depthOf = (y) => Math.max(0, (y - surfaceY()) / PPM);
  function layout() {
    W = innerWidth; H = innerHeight; DPR = Math.min(devicePixelRatio || 1, 2);
    PPM = Math.max(2.4, Math.min(3.4, H / 260)) * (W < 700 ? 1.25 : 1);
    S.forEach((s) => { s.el.style.top = (yOf(s.depth) - 40) + "px"; });
    const last = S[S.length - 1];
    total = Math.max(yOf(MAX_DEPTH) + H * 0.35, last.el.offsetTop + last.el.offsetHeight + 60);
    main.style.height = total + "px";
    cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildTrack();
  }

  /* ---------------- Gauge ---------------- */
  function buildTrack() {
    const tr = $("#track");
    tr.querySelectorAll("button").forEach((b) => b.remove());
    S.forEach((s) => {
      const b = document.createElement("button");
      b.type = "button"; b.dataset.label = `${s.label} · ${fmt(s.depth)}`; b.setAttribute("aria-label", `Dive to ${s.label}, ${fmt(s.depth)}`);
      b.style.top = (s.depth / MAX_DEPTH * 100) + "%";
      b.onclick = () => dive(s);
      tr.appendChild(b);
    });
  }
  function dive(s) { scrollTo({ top: Math.max(0, s.el.offsetTop - H * 0.18), behavior: reduce ? "auto" : "smooth" }); }
  $("#diveBtn").addEventListener("click", (ev) => { ev.preventDefault(); dive(S[0]); });
  document.addEventListener("click", (ev) => { if (ev.target.closest("#resurface")) scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" }); });

  const io = new IntersectionObserver((es) => es.forEach((en) => { if (en.isIntersecting) en.target.classList.add("seen"); }), { rootMargin: "0px 0px -12% 0px" });
  document.querySelectorAll(".panel").forEach((p) => io.observe(p));

  /* ---------------- Ocean renderer ---------------- */
  const cv = $("#sea"), ctx = cv.getContext("2d");
  const rnd = (i, s = 0) => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };
  const lerp = (a, b, t) => a + (b - a) * t;
  const COL = [[0, [38, 150, 196]], [200, [12, 82, 128]], [800, [6, 42, 74]], [2000, [3, 18, 42]], [MAX_DEPTH, [1, 6, 15]]];
  function waterAt(d) {
    for (let i = 0; i < COL.length - 1; i++) {
      const [d0, c0] = COL[i], [d1, c1] = COL[i + 1];
      if (d <= d1) { const t = Math.max(0, (d - d0) / (d1 - d0)); return c0.map((v, k) => Math.round(lerp(v, c1[k], t))); }
    }
    return COL[COL.length - 1][1];
  }
  const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  const snow = Array.from({ length: 160 }, (_, i) => ({ x: rnd(i, 1), y: rnd(i, 2), z: 0.3 + rnd(i, 3) * 0.7, r: 0.4 + rnd(i, 4) * 1.3 }));
  const fish = Array.from({ length: 46 }, (_, i) => ({ x: rnd(i, 5), d: 20 + rnd(i, 6) * 260, s: 0.4 + rnd(i, 7) * 0.8, ph: rnd(i, 8) * 6, sz: 3 + rnd(i, 9) * 4, dir: rnd(i, 10) > .5 ? 1 : -1 }));
  let mx = -1, my = -1, light = 0, lastTop = 0, vel = 0, shownDepth = 0;
  const bubbles = [];
  function bubblesStep(top) {
    vel += ((top - lastTop) - vel) * .2; lastTop = top;
    const spawn = Math.min(6, Math.abs(vel) * .08);
    for (let k = 0; k < spawn; k++) if (bubbles.length < 220 && Math.random() < .8) bubbles.push({ x: Math.random() * W, y: vel > 0 ? H + 10 : -10, r: .8 + Math.random() * 2.6, s: .5 + Math.random(), w: Math.random() * 6 });
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      b.y -= (1.2 + b.s * 1.6) + vel * .55 * b.s;
      b.x += Math.sin((b.y + b.w * 40) * .03) * .4;
      if (b.y < -20 || b.y > H + 20) { bubbles.splice(i, 1); continue; }
      ctx.strokeStyle = `rgba(210,240,255,${.35 * b.s})`; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.stroke();
    }
  }
  addEventListener("pointermove", (ev) => { mx = ev.clientX; my = ev.clientY; }, { passive: true });

  function drawSurface(t, top) {
    // sky and sun above the waterline (only on the first screen)
    const wl = surfaceY() - top;
    if (wl <= 0) return;
    const sky = ctx.createLinearGradient(0, -top, 0, wl);
    sky.addColorStop(0, "#f7c6a3"); sky.addColorStop(.55, "#f4b8a0"); sky.addColorStop(1, "#bfe3f0");
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, wl);
    const sx = W * 0.72, sy = wl - H * 0.14;
    const sg = ctx.createRadialGradient(sx, sy, 4, sx, sy, H * 0.35);
    sg.addColorStop(0, "rgba(255,244,214,1)"); sg.addColorStop(.08, "rgba(255,236,200,.9)"); sg.addColorStop(1, "rgba(255,220,180,0)");
    ctx.fillStyle = sg; ctx.fillRect(0, 0, W, wl);
    // boat
    const bx = W * 0.24 + Math.sin(t * .0004) * 6, by = wl + Math.sin(t * .0016) * 2;
    ctx.fillStyle = "#24323f";
    ctx.beginPath(); ctx.moveTo(bx - 46, by - 10); ctx.lineTo(bx + 52, by - 10); ctx.lineTo(bx + 36, by + 4); ctx.lineTo(bx - 34, by + 4); ctx.fill();
    ctx.fillRect(bx - 12, by - 26, 26, 16); ctx.fillRect(bx + 20, by - 44, 2, 34);
    ctx.strokeStyle = "#24323f"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(bx + 21, by - 42); ctx.lineTo(bx + 40, by + 30 + Math.sin(t * .001) * 4); ctx.stroke();
    // waves
    ctx.fillStyle = "rgba(255,255,255,.55)";
    for (let x = 0; x < W; x += 3) { const y = wl + Math.sin(x * .02 + t * .002) * 2 + Math.sin(x * .007 - t * .001) * 3; ctx.fillRect(x, y - 1, 3, 2); }
    // glitter
    for (let i = 0; i < 40; i++) {
      const gx = sx + (rnd(i, 30) - .5) * W * .35, gy = wl + 6 + rnd(i, 31) * 50;
      ctx.globalAlpha = Math.max(0, Math.sin(t * .004 + i * 1.7)) * .8;
      ctx.fillStyle = "#fff"; ctx.fillRect(gx, gy, 6 + rnd(i, 32) * 10, 1);
    }
    ctx.globalAlpha = 1;
  }

  function jelly(x, y, t, glow, s, a) {
    const pulse = Math.sin(t * .0022 + x) * .5 + .5;
    const r = 26 * s, h = r * (0.7 + pulse * .15);
    ctx.save(); ctx.translate(x, y);
    ctx.globalCompositeOperation = "lighter";
    const g = ctx.createRadialGradient(0, 0, 2, 0, 0, r * 3.2);
    g.addColorStop(0, glow + "55"); g.addColorStop(1, glow + "00");
    ctx.fillStyle = g; ctx.globalAlpha = a; ctx.beginPath(); ctx.arc(0, 0, r * 3.2, 0, 7); ctx.fill();
    ctx.globalAlpha = a * .9;
    ctx.fillStyle = glow + "66"; ctx.strokeStyle = glow; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.ellipse(0, 0, r * (1 - pulse * .1), h, 0, Math.PI, 0); ctx.lineTo(r, 4); ctx.quadraticCurveTo(0, 10 - pulse * 6, -r, 4); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.lineWidth = 1;
    for (let k = -3; k <= 3; k++) {
      ctx.beginPath(); ctx.moveTo(k * r / 4, 6);
      for (let j = 1; j <= 10; j++) ctx.lineTo(k * r / 4 + Math.sin(t * .002 + j * .7 + k) * 5 * s, 6 + j * 9 * s);
      ctx.globalAlpha = a * .55; ctx.stroke();
    }
    ctx.restore();
  }
  function angler(x, y, t, glow, a, dir) {
    ctx.save(); ctx.translate(x, y); ctx.scale(dir, 1);
    // dim body silhouette (seen only in the light)
    ctx.fillStyle = "rgba(20,30,40,.9)";
    ctx.beginPath(); ctx.ellipse(0, 0, 46, 30, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-40, 0); ctx.lineTo(-74, -20); ctx.lineTo(-70, 22); ctx.fill();
    ctx.fillStyle = "rgba(200,220,230,.25)";
    for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.moveTo(18 + i * 5, 8); ctx.lineTo(20 + i * 5, 16); ctx.lineTo(22 + i * 5, 8); ctx.fill(); }
    // lure
    const lx = 54 + Math.sin(t * .0015) * 6, ly = -48 + Math.cos(t * .0012) * 6;
    ctx.strokeStyle = "rgba(160,190,200,.4)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(14, -26); ctx.quadraticCurveTo(40, -70, lx, ly); ctx.stroke();
    ctx.globalCompositeOperation = "lighter";
    const flick = .8 + Math.sin(t * .01) * .1 + Math.sin(t * .023) * .1;
    const g = ctx.createRadialGradient(lx, ly, 0, lx, ly, 70);
    g.addColorStop(0, glow); g.addColorStop(.12, glow + "aa"); g.addColorStop(1, glow + "00");
    ctx.globalAlpha = a * flick; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(lx, ly, 70, 0, 7); ctx.fill();
    ctx.restore();
  }
  function vent(x, y, t) {
    ctx.fillStyle = "#0b1218";
    ctx.beginPath(); ctx.moveTo(x - 60, y + 120); ctx.lineTo(x - 20, y); ctx.lineTo(x + 18, y); ctx.lineTo(x + 70, y + 120); ctx.fill();
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < 30; i++) {
      const k = ((t * .0004 + rnd(i, 40)) % 1);
      const px = x + Math.sin(k * 8 + i) * (8 + k * 30), py = y - k * 220;
      ctx.fillStyle = `rgba(255,${140 + i * 3},90,${(1 - k) * .5})`;
      ctx.beginPath(); ctx.arc(px, py, 2 + k * 8, 0, 7); ctx.fill();
    }
    const g = ctx.createRadialGradient(x, y, 0, x, y, 90);
    g.addColorStop(0, "rgba(255,120,60,.45)"); g.addColorStop(1, "rgba(255,120,60,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 90, 0, 7); ctx.fill();
    ctx.globalCompositeOperation = "source-over";
  }
  function floor(top, t) {
    const fy = yOf(MAX_DEPTH) - top + 60;
    if (fy > H + 50) return;
    const sand = ctx.createLinearGradient(0, fy - 30, 0, fy + 200);
    sand.addColorStop(0, "#1b2a36"); sand.addColorStop(1, "#060b11");
    ctx.fillStyle = sand;
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 8) ctx.lineTo(x, fy + Math.sin(x * .006) * 20 + Math.sin(x * .021) * 6);
    ctx.lineTo(W, H); ctx.fill();
    const bx = W * (W < 700 ? 0.5 : 0.72), by = fy - 10;
    ctx.fillStyle = "#1a242e"; ctx.fillRect(bx - 3, by - 60, 6, 60);
  }
  function beacon(top, t) {
    const fy = yOf(MAX_DEPTH) - top + 60;
    if (fy > H + 200) return;
    const bx = W * (W < 700 ? 0.5 : 0.72), by = fy - 10;
    ctx.globalCompositeOperation = "lighter";
    const on = (Math.sin(t * .004) + 1) / 2;
    const g = ctx.createRadialGradient(bx, by - 64, 0, bx, by - 64, 140);
    g.addColorStop(0, `rgba(255,90,90,${.6 + on * .4})`); g.addColorStop(.1, `rgba(255,90,90,${.25 + on * .2})`); g.addColorStop(1, "rgba(255,90,90,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(bx, by - 64, 140, 0, 7); ctx.fill();
    for (let k = 0; k < 3; k++) {
      const p = ((t * .0003) + k / 3) % 1;
      ctx.strokeStyle = `rgba(255,120,120,${(1 - p) * .35})`; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(bx, by - 64, 20 + p * 260, 0, 7); ctx.stroke();
    }
    ctx.globalCompositeOperation = "source-over";
  }

  function draw(t) {
    const top = scrollY;
    const d0 = depthOf(top), d1 = depthOf(top + H);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgb(waterAt(d0))); g.addColorStop(1, rgb(waterAt(d1)));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // light rays near the surface
    const rayA = Math.max(0, 1 - d0 / 260);
    if (rayA > 0) {
      ctx.save(); ctx.globalCompositeOperation = "lighter";
      for (let i = 0; i < 7; i++) {
        const x = W * (i / 6) + Math.sin(t * .0003 + i) * 60, wl = Math.max(0, surfaceY() - top);
        const rg = ctx.createLinearGradient(0, wl, 0, wl + H * 1.1);
        rg.addColorStop(0, `rgba(200,240,255,${.12 * rayA})`); rg.addColorStop(1, "rgba(200,240,255,0)");
        ctx.fillStyle = rg; ctx.beginPath();
        ctx.moveTo(x - 20, wl); ctx.lineTo(x + 30, wl); ctx.lineTo(x + 160 + i * 10, wl + H * 1.1); ctx.lineTo(x + 40, wl + H * 1.1); ctx.fill();
      }
      ctx.restore();
    }

    // fish schools
    const fishA = Math.max(0, 1 - d0 / 420);
    if (fishA > 0) {
      ctx.fillStyle = `rgba(10,40,60,${.55 * fishA})`;
      fish.forEach((f) => {
        const y = yOf(f.d) - top; if (y < -20 || y > H + 20) return;
        const x = (((f.x * W * 1.4 + t * .03 * f.s * f.dir) % (W * 1.4)) + W * 1.4) % (W * 1.4) - W * .2;
        const yy = y + Math.sin(t * .002 + f.ph) * 6;
        ctx.beginPath(); ctx.ellipse(x, yy, f.sz * 2, f.sz * .8, 0, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.moveTo(x - f.dir * f.sz * 1.8, yy); ctx.lineTo(x - f.dir * f.sz * 3, yy - f.sz); ctx.lineTo(x - f.dir * f.sz * 3, yy + f.sz); ctx.fill();
      });
    }

    drawSurface(t, top);

    // station creatures (bodies first)
    S.forEach((s) => {
      const y = yOf(s.depth) - top + (W < 700 ? 340 : 120); if (y < -300 || y > H + 300) return;
      const x = W < 700 ? W * (s.side > 0 ? .18 : .82) : W * (s.side > 0 ? .3 : .7);
      if (s.creature === "angler") angler(x, y + 40, t, s.glow, 1, s.side > 0 ? 1 : -1);
      if (s.creature === "vent") vent(x, y + 80, t);
      if (s.creature === "core") {
        ctx.fillStyle = "rgba(60,70,80,.5)"; ctx.fillRect(x - 10, y - 60, 20, 160);
        for (let k = 0; k < 8; k++) { ctx.fillStyle = `rgba(${120 + k * 10},${100 + k * 6},${80},.35)`; ctx.fillRect(x - 10, y - 60 + k * 20, 20, 10); }
      }
    });
    floor(top, t);

    // darkness with a flashlight
    const dark = Math.min(.9, Math.max(0, (d0 - 150) / 1300));
    if (dark > 0) {
      light += ((mx >= 0 ? 1 : 0) - light) * .05;
      const lx = mx >= 0 ? mx : W / 2, ly = my >= 0 ? my : H / 2;
      const rg = ctx.createRadialGradient(lx, ly, 10, lx, ly, Math.max(W, H) * (.28 + .1 * light));
      rg.addColorStop(0, `rgba(0,0,0,${dark * .15})`); rg.addColorStop(1, `rgba(0,0,0,${dark})`);
      ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
    }

    // bioluminescence on top of the dark
    S.forEach((s) => {
      const y = yOf(s.depth) - top + (W < 700 ? 340 : 120); if (y < -300 || y > H + 300) return;
      const x = W < 700 ? W * (s.side > 0 ? .18 : .82) : W * (s.side > 0 ? .3 : .7);
      if (s.creature === "jelly") jelly(x, y + Math.sin(t * .0007 + s.depth) * 20, t, s.glow, W < 700 ? .8 : 1.1, 1);
      if (s.creature === "angler") {
        ctx.save(); ctx.globalCompositeOperation = "lighter";
        const dir = s.side > 0 ? 1 : -1, lx = x + dir * (54 + Math.sin(t * .0015) * 6), ly = y + 40 - 48 + Math.cos(t * .0012) * 6;
        ctx.fillStyle = s.glow; ctx.globalAlpha = .9; ctx.beginPath(); ctx.arc(lx, ly, 4, 0, 7); ctx.fill(); ctx.restore();
      }
    });
    beacon(top, t);
    // siphonophore chain in the midnight zone
    const sy = yOf(2350) - top;
    if (sy > -400 && sy < H + 400) {
      ctx.save(); ctx.globalCompositeOperation = "lighter";
      for (let i = 0; i < 40; i++) {
        const px = W * .5 + Math.sin(i * .25 + t * .0006) * W * .25, py = sy - 200 + i * 12;
        ctx.fillStyle = `rgba(140,255,220,${.25 + .25 * Math.sin(t * .003 - i * .4)})`;
        ctx.beginPath(); ctx.arc(px, py, 2.2, 0, 7); ctx.fill();
      }
      ctx.restore();
    }

    // marine snow
    const snowA = Math.min(1, d0 / 120);
    if (snowA > 0) {
      ctx.fillStyle = "rgba(220,240,255,.6)";
      snow.forEach((p) => {
        const y = (((p.y * H * 1.2 - top * p.z * .35 + t * .012 * p.z) % (H * 1.2)) + H * 1.2) % (H * 1.2) - H * .1;
        const x = p.x * W + Math.sin(t * .0005 + p.y * 9) * 12;
        ctx.globalAlpha = snowA * p.z * .7; ctx.beginPath(); ctx.arc(x, y, p.r, 0, 7); ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    if (!reduce) bubblesStep(top);
    // gauge (eased so the number glides)
    shownDepth += (Math.min(MAX_DEPTH, depthOf(top + H * 0.4)) - shownDepth) * (reduce ? 1 : .12);
    const dm = shownDepth;
    $("#depth").textContent = fmt(dm);
    $("#zone").textContent = zoneAt(dm);
    const temp = dm < 200 ? 18 - dm / 200 * 6 : dm < 1000 ? 12 - (dm - 200) / 800 * 8 : Math.max(2, 4 - (dm - 1000) / 1500);
    $("#temp").textContent = `${temp.toFixed(1)}°C · ${(1 + dm / 10).toFixed(0)} atm`;
    $("#fill").style.height = (dm / MAX_DEPTH * 100) + "%";
    $("#gauge").classList.toggle("hide", top < H * 0.3);
  }

  function frame(t) { draw(reduce ? 0 : t); requestAnimationFrame(frame); }
  let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(layout, 120); });
  layout();
  const deepLink = () => { const m = location.hash.match(/s-([\w-]+)/); const st = m && S.find((x) => x.id === m[1]); if (st) { scrollTo(0, st.el.offsetTop - H * .18); document.querySelectorAll(".panel").forEach((p) => p.classList.add("seen")); } };
  document.fonts && document.fonts.ready.then(() => { layout(); deepLink(); });
  const deep = location.hash.match(/s-([\w-]+)/);
  if (deep) { const s = S.find((x) => x.id === deep[1]); if (s) requestAnimationFrame(() => { scrollTo(0, s.el.offsetTop - H * .18); document.querySelectorAll(".panel").forEach((p) => p.classList.add("seen")); }); }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
