<!DOCTYPE html>
<html lang="en" data-world="record" data-switcher="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Selected Works LP — Grigory Shatalin</title>
<meta name="description" content="Grigory Shatalin, software engineer — Selected Works, on vinyl. Side A: experience. Side B: projects." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Libre+Franklin:ital,wght@0,300;0,400;0,600;0,800;1,400&display=swap" rel="stylesheet">
<script src="../../shared/data.js"></script>
<script src="../../shared/kit.js"></script>
<style>
:root { --cream: #efe6d6; --paper: #f7f1e6; --ink: #1a1714; --orange: #ee6a2b; --blue: #1f3d73; --mute: #7a7166; --display: "Anton", Impact, sans-serif; --sans: "Libre Franklin", system-ui, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--cream); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
body {
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.55), transparent 55%),
    radial-gradient(ellipse at 80% 90%, rgba(150,110,60,.12), transparent 50%),
    var(--cream);
}
.wrap { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(320px, 1fr); gap: clamp(20px, 4vw, 64px); max-width: 1380px; margin: 0 auto; padding: clamp(18px, 4vw, 56px); min-height: 100vh; align-items: center; }

/* ---------- Turntable ---------- */
.deck { position: relative; }
.plinth {
  position: relative; width: 100%; aspect-ratio: 1.22 / 1; border-radius: 14px;
  background: linear-gradient(180deg, #faf8f3, #e9e5dc);
  box-shadow: 0 2px 0 #fff inset, 0 -3px 0 rgba(0,0,0,.06) inset, 0 40px 60px -30px rgba(60,40,20,.45), 0 0 0 10px #8b5a32, 0 0 0 11px #6d4423, 0 50px 80px -40px rgba(60,40,20,.5);
}
.plinth::after { content: ""; position: absolute; inset: 0; border-radius: 14px; pointer-events: none; background: linear-gradient(115deg, rgba(255,255,255,.4) 0 20%, transparent 40%); }
.platter { position: absolute; border-radius: 50%; background: radial-gradient(circle, #8d8d8d 0 60%, #6f6f6f 62%, #a7a7a7 64%, #7c7c7c 100%); box-shadow: 0 8px 18px rgba(0,0,0,.35); }
.record { position: absolute; border-radius: 50%; transition: transform 1.4s cubic-bezier(.2,.8,.2,1); }
.record canvas { width: 100%; height: 100%; display: block; border-radius: 50%; touch-action: none; cursor: grab; }
.record.flip { animation: flip 1.1s cubic-bezier(.6,0,.3,1); }
@keyframes flip { 0% { transform: perspective(1200px) rotateY(0); } 50% { transform: perspective(1200px) rotateY(90deg) translateY(-6%); } 100% { transform: perspective(1200px) rotateY(0); } }
.sheen { position: absolute; border-radius: 50%; pointer-events: none; background: conic-gradient(from 20deg, transparent 0 10%, rgba(255,255,255,.14) 14%, transparent 20% 52%, rgba(255,255,255,.1) 60%, transparent 66%); mix-blend-mode: screen; }
#arm { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
#arm .grab { pointer-events: auto; cursor: grab; }
.ctrls { position: absolute; left: 4%; bottom: 5%; display: flex; gap: 10px; align-items: center; }
.ctrls button {
  border: 0; font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; cursor: pointer; color: var(--ink);
  background: linear-gradient(#fdfcf9, #e4e0d6); padding: 9px 12px; border-radius: 6px;
  box-shadow: 0 1px 0 #fff inset, 0 2px 0 #c9c3b6, 0 3px 6px rgba(0,0,0,.15);
}
.ctrls #sound[aria-pressed="true"] { color: #fff; background: var(--orange); box-shadow: 0 2px 0 #b84a17; }
.ctrls button[aria-pressed="true"] { background: linear-gradient(#e4e0d6, #f3f0ea); box-shadow: 0 1px 2px rgba(0,0,0,.2) inset; color: var(--orange); }
.ctrls button:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
.ctrls .play { width: 46px; height: 46px; padding: 0; border-radius: 50%; background: var(--orange); color: #fff; font-size: 16px; box-shadow: 0 2px 0 #b84a17, 0 4px 10px rgba(0,0,0,.2); }
.ctrls .play[aria-pressed="true"] { background: var(--ink); color: #fff; }
.brand { position: absolute; right: 4%; bottom: 6%; font: 800 11px/1 var(--sans); letter-spacing: .3em; color: #b7b1a5; }
.led { position: absolute; right: 4%; top: 6%; display: flex; gap: 8px; align-items: center; font: 600 10px var(--sans); letter-spacing: .14em; color: var(--mute); }
.led i { width: 7px; height: 7px; border-radius: 50%; background: #ccc; box-shadow: inset 0 1px 2px rgba(0,0,0,.3); }
.led.on i { background: var(--orange); box-shadow: 0 0 8px var(--orange); }

/* ---------- Sleeve & tracklist ---------- */
.side { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.album { display: flex; gap: 18px; align-items: flex-end; }
.cover { flex: none; width: 128px; aspect-ratio: 1; position: relative; overflow: hidden; background: var(--blue); box-shadow: 0 14px 24px -12px rgba(0,0,0,.5); }
.cover b { position: absolute; left: 8px; right: 8px; top: 8px; font: 400 30px/.86 var(--display); color: var(--paper); text-transform: uppercase; letter-spacing: .01em; }
.cover span { position: absolute; left: 0; bottom: 0; width: 62%; height: 34%; background: var(--orange); }
.cover i { position: absolute; right: 8px; bottom: 8px; font: 800 8px/1.3 var(--sans); letter-spacing: .18em; color: var(--paper); text-align: right; text-transform: uppercase; font-style: normal; }
.album h1 { font: 400 clamp(38px, 4.6vw, 64px)/.9 var(--display); margin: 0; text-transform: uppercase; letter-spacing: .005em; }
.album p { margin: 8px 0 0; font-size: 13px; color: var(--mute); letter-spacing: .04em; }
.tabs { display: flex; gap: 2px; border-bottom: 2px solid var(--ink); }
.tabs button { border: 0; background: none; cursor: pointer; font: 400 18px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; padding: 10px 14px 8px; color: var(--mute); }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); }
.tabs button:focus-visible { outline: 2px solid var(--orange); outline-offset: -2px; }
.tracks { list-style: none; margin: 0; padding: 0; }
.tracks button { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: baseline; width: 100%; padding: 11px 6px; border-bottom: 1px solid rgba(26,23,20,.14); }
.tracks button:hover, .tracks button:focus-visible { background: rgba(238,106,43,.08); }
.tracks .n { font: 400 15px var(--display); color: var(--mute); }
.tracks button:hover .n, .tracks button:focus-visible .n { color: transparent; position: relative; }
.tracks button:hover .n::after, .tracks button:focus-visible .n::after { content: "▶"; position: absolute; left: 0; color: var(--orange); }
.tracks .t { font-weight: 600; font-size: 15px; }
.tracks .t small { display: block; font-weight: 400; font-size: 12.5px; color: var(--mute); margin-top: 2px; }
.tracks .d { font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums; }
.tracks button[aria-current="true"] .n { color: var(--orange); }
.tracks button[aria-current="true"] .t { color: var(--orange); }
.eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; margin-left: 8px; vertical-align: -1px; }
.eq i { width: 3px; background: var(--orange); animation: eq .8s ease-in-out infinite; }
.eq i:nth-child(2) { animation-delay: -.3s; } .eq i:nth-child(3) { animation-delay: -.55s; }
@keyframes eq { 0%, 100% { height: 3px; } 50% { height: 12px; } }
body:not(.playing) .eq i { animation-play-state: paused; }
.now { background: var(--paper); padding: 20px 22px; box-shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 20px 40px -26px rgba(60,40,20,.5); border-left: 6px solid var(--orange); min-height: 200px; }
.now .k { font: 800 10px/1 var(--sans); letter-spacing: .26em; text-transform: uppercase; color: var(--orange); margin: 0 0 8px; }
.now h2 { font: 400 clamp(26px, 2.6vw, 36px)/.95 var(--display); text-transform: uppercase; margin: 0 0 6px; }
.now .meta { font-size: 13px; color: var(--mute); margin: 0 0 12px; }
.now .lyrics p { font-size: 14.5px; line-height: 1.6; margin: 0 0 10px; }
.now .lyrics p::before { content: "♪ "; color: var(--orange); }
.now a { color: var(--blue); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chips span { font-size: 11px; font-weight: 600; letter-spacing: .06em; padding: 4px 9px; border: 1.5px solid var(--ink); border-radius: 99px; }
.notes { columns: 2; column-gap: 26px; font-size: 13.5px; line-height: 1.6; }
.notes h3 { font: 400 17px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; margin: 0 0 6px; break-after: avoid; }
.notes section { break-inside: avoid; margin-bottom: 16px; }
.notes p { margin: 0 0 6px; }
.notes a { color: var(--blue); }
.notes dl { margin: 0; } .notes dt { font-weight: 600; } .notes dd { margin: 0 0 6px; color: #4b443c; }
@media (max-width: 900px) {
  .wrap { grid-template-columns: 1fr; padding-top: 64px; }
  .cover { width: 92px; }
  .cover b { font-size: 22px; }
  .notes { columns: 1; }
  .plinth { aspect-ratio: 1 / 1.08; }
  .brand { display: none; }
}
@media (prefers-reduced-motion: reduce) { .record { transition: none; } .record.flip { animation: none; } .eq i { animation: none; height: 8px; } }
</style>
</head>
<body>
<div class="wrap">
  <section class="deck" aria-label="Turntable">
    <div class="plinth" id="plinth">
      <div class="led" id="led" hidden><i></i><span id="rpm">33⅓</span></div>
      <div class="platter" id="platter"></div>
      <div class="record" id="record"><canvas id="disc" aria-label="Vinyl record — drag to spin"></canvas></div>
      <div class="sheen" id="sheen"></div>
      <svg id="arm" aria-hidden="true"></svg>
      <div class="ctrls">
        <button id="prevT" aria-label="Previous track">⏮</button>
        <button class="play" id="play" aria-pressed="false" aria-label="Play">▶</button>
        <button id="nextT" aria-label="Next track">⏭</button>
        <button id="sound" aria-pressed="false" title="Soft ambient music and vinyl crackle, generated in your browser">♪ Music: off</button>
      </div>
      <span id="sideLbl" hidden>A</span><span id="flipBtn" hidden></span><span id="speed" hidden></span>
    </div>
  </section>

  <section class="side">
    <div class="album">
      <div class="cover" aria-hidden="true"><b>Selected<br>Works</b><span></span><i>Grigory<br>Shatalin</i></div>
      <div><h1 id="title"></h1><p id="subtitle"></p></div>
    </div>
    <div>
      <div class="tabs" role="tablist">
        <button role="tab" id="tabA" aria-selected="true" data-tab="A">Side A</button>
        <button role="tab" id="tabB" aria-selected="false" data-tab="B">Side B</button>
        <button role="tab" id="tabN" aria-selected="false" data-tab="N">Liner notes</button>
      </div>
      <ol class="tracks" id="tracks"></ol>
      <div class="notes" id="notes" hidden></div>
    </div>
    <article class="now" id="now" aria-live="polite"></article>
  </section>
</div>

<script>
(function () {
  const P = window.PORTFOLIO, K = window.Kit, e = K.esc;
  const $ = (s) => document.querySelector(s);
  const reduce = K.reduceMotion;
  const ext = 'target="_blank" rel="noopener noreferrer"';
  const yr = (d) => (d.match(/\d{4}/g) || [""]).slice(-1)[0];

  $("#title").textContent = "Selected Works";
  $("#subtitle").textContent = `${P.name} · ${P.role} · LP, ${new Date().getFullYear()}`;

  /* ---------------- Tracks ---------------- */
  const SIDES = {
    A: P.experience.map((x) => ({
      title: x.orgShort + (x.team ? ` (${x.team})` : ""), sub: x.role, date: yr(x.dates),
      html: `<p class="k">Now playing · Side A</p><h2>${e(x.org)}</h2>
        <p class="meta">${e(x.role)}${x.team ? " · " + e(x.team) : ""} — ${e(x.location)} — ${e(x.dates)}</p>
        <div class="lyrics"><p>${e(x.summary)}</p></div>
        ${x.link ? `<a href="${e(x.link.href)}" ${ext}>${e(x.link.label)} ↗</a>` : ""}
        <div class="chips">${x.tags.map((t) => `<span>${e(t)}</span>`).join("")}</div>`,
    })),
    B: P.projects.map((p) => ({
      title: p.name, sub: p.tagline, date: p.status,
      html: `<p class="k">Now playing · Side B</p><h2>${e(p.name)}</h2>
        <p class="meta">${e(p.status)}</p>
        <div class="lyrics"><p>${e(p.desc)}</p></div>
        <a href="${e(p.url)}" ${ext}>Listen to the source on GitHub ↗</a>
        <div class="chips">${p.tags.map((t) => `<span>${e(t)}</span>`).join("")}</div>`,
    })),
  };
  $("#notes").innerHTML = `
    <section><h3>About the artist</h3><p>${e(P.intro)}</p></section>
    <section><h3>Personnel</h3><dl>${P.skills.map((s) => `<dt>${e(s.group)}</dt><dd>${e(s.items.join(", "))}</dd>`).join("")}</dl></section>
    <section><h3>Recorded at</h3>${P.education.map((d) => `<p><b>${e(d.school)}</b><br>${e(d.degree)} — ${e(d.dates)} · GPA ${e(d.gpa)}</p>`).join("")}</section>
    <section><h3>Producer's notes</h3>${P.principles.map((x) => `<p>${e(x)}</p>`).join("")}</section>
    <section><h3>Booking &amp; press</h3>${P.contacts.map((c) => `<p>${e(c.label)} — <a href="${e(c.href)}" ${c.id === "email" ? "" : ext}>${e(c.handle)}</a></p>`).join("")}</section>`;

  let side = "A", track = -1, playing = false, tab = "A";
  function renderTracks() {
    const showNotes = tab === "N";
    $("#notes").hidden = !showNotes; $("#tracks").hidden = showNotes;
    ["A", "B", "N"].forEach((t) => $("#tab" + t).setAttribute("aria-selected", String(t === tab)));
    if (showNotes) return;
    $("#tracks").innerHTML = SIDES[tab].map((t, i) => `<li><button type="button" data-i="${i}" ${tab === side && i === track ? 'aria-current="true"' : ""}>
      <span class="n">${tab}${i + 1}</span><span class="t">${e(t.title)}${tab === side && i === track ? '<span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>' : ""}<small>${e(t.sub)}</small></span><span class="d">${e(t.date)}</span></button></li>`).join("");
  }
  document.querySelector(".tabs").addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-tab]"); if (!b) return;
    tab = b.dataset.tab;
    if (tab !== "N" && tab !== side) flip(tab, false);
    renderTracks();
  });
  $("#tracks").addEventListener("click", (ev) => { const b = ev.target.closest("[data-i]"); if (b) cue(+b.dataset.i, true); });

  function cue(i, start) {
    track = i;
    $("#now").innerHTML = SIDES[side][i].html;
    renderTracks();
    armTo(trackR(i));
    if (start && !playing) setPlay(true);
    audio.chord(i, side);
  }

  /* ---------------- Geometry ---------------- */
  const plinth = $("#plinth"), rec = $("#record"), disc = $("#disc"), dctx = disc.getContext("2d");
  let G = {};
  function layout() {
    const w = plinth.clientWidth, h = plinth.clientHeight;
    const narrowDeck = w / h < 1.05;
    const R = narrowDeck ? w * 0.36 : h * 0.43, cx = w * 0.42, cy = narrowDeck ? R + h * 0.07 : h * 0.5;
    G = { w, h, R, cx, cy };
    const pl = $("#platter"); Object.assign(pl.style, { left: cx - R * 1.04 + "px", top: cy - R * 1.04 + "px", width: R * 2.08 + "px", height: R * 2.08 + "px" });
    [rec, $("#sheen")].forEach((el) => Object.assign(el.style, { left: cx - R + "px", top: cy - R + "px", width: R * 2 + "px", height: R * 2 + "px" }));
    const dpr = Math.min(devicePixelRatio || 1, 2);
    disc.width = disc.height = Math.round(R * 2 * dpr);
    dctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawDisc();
    drawArm();
  }
  const N = () => SIDES[side].length;
  const R_OUT = 0.96, R_IN = 0.44;
  const trackR = (i) => R_OUT - (R_OUT - R_IN) * (i / N()) - 0.02;

  function drawDisc() {
    const { R } = G, c = dctx;
    c.clearRect(0, 0, R * 2, R * 2);
    c.save(); c.translate(R, R);
    const g = c.createRadialGradient(0, 0, R * .3, 0, 0, R);
    g.addColorStop(0, "#151515"); g.addColorStop(1, "#0b0b0b");
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, R, 0, 7); c.fill();
    // grooves
    for (let r = R * 0.98; r > R * 0.4; r -= 1.6) {
      c.strokeStyle = `rgba(255,255,255,${0.025 + 0.02 * Math.sin(r * 1.7)})`; c.lineWidth = .8;
      c.beginPath(); c.arc(0, 0, r, 0, 7); c.stroke();
    }
    // gaps between tracks
    for (let i = 1; i < N(); i++) {
      const r = R * (R_OUT - (R_OUT - R_IN) * (i / N()));
      c.strokeStyle = "rgba(255,255,255,.09)"; c.lineWidth = 2.5; c.beginPath(); c.arc(0, 0, r, 0, 7); c.stroke();
      c.strokeStyle = "rgba(0,0,0,.8)"; c.lineWidth = 1; c.beginPath(); c.arc(0, 0, r - 1.6, 0, 7); c.stroke();
    }
    // label
    const lr = R * 0.34;
    c.fillStyle = side === "A" ? "#ee6a2b" : "#1f3d73"; c.beginPath(); c.arc(0, 0, lr, 0, 7); c.fill();
    c.strokeStyle = "rgba(255,255,255,.35)"; c.lineWidth = 1; c.beginPath(); c.arc(0, 0, lr * .93, 0, 7); c.stroke();
    c.fillStyle = "#f7f1e6"; c.textAlign = "center"; c.textBaseline = "middle";
    c.font = `400 ${lr * .26}px Anton, Impact, sans-serif`; c.fillText("SELECTED WORKS", 0, -lr * .5);
    c.font = `600 ${lr * .1}px "Libre Franklin", sans-serif`; c.fillText(P.name.toUpperCase(), 0, -lr * .26);
    c.font = `400 ${lr * .34}px Anton, Impact, sans-serif`; c.fillText("SIDE " + side, lr * 0, lr * .38);
    c.font = `600 ${lr * .085}px "Libre Franklin", sans-serif`; c.fillText("33⅓ RPM · STEREO · GS-26", 0, lr * .72);
    // spindle hole
    c.fillStyle = "#d7d2c8"; c.beginPath(); c.arc(0, 0, R * .022, 0, 7); c.fill();
    c.restore();
  }

  /* ---------------- Tonearm ---------------- */
  // pivot sits up and to the right of the platter, in units of R
  const PIV = { x: 1.32, y: -0.86 }, ARM = 1.5;
  let armR = 1.25, armTarget = 1.25, dragArm = false;
  function angleFor(r) {
    const d = Math.hypot(PIV.x, PIV.y), phi0 = Math.atan2(-PIV.y, -PIV.x);
    const cosA = Math.max(-1, Math.min(1, (ARM * ARM + d * d - r * r) / (2 * ARM * d)));
    return phi0 - Math.acos(cosA);
  }
  function drawArm() {
    const { R, cx, cy, w, h } = G;
    const px = cx + PIV.x * R, py = cy + PIV.y * R;
    const th = angleFor(armR);
    const sx = px + Math.cos(th) * ARM * R, sy = py + Math.sin(th) * ARM * R;
    const hx = sx + Math.cos(th - .5) * R * .1, hy = sy + Math.sin(th - .5) * R * .1;
    const cwx = px - Math.cos(th) * R * .28, cwy = py - Math.sin(th) * R * .28;
    const svg = $("#arm");
    svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
    svg.innerHTML = `
      <defs><linearGradient id="metal" x1="0" x2="1"><stop offset="0" stop-color="#f3f3f1"/><stop offset=".5" stop-color="#b9b8b4"/><stop offset="1" stop-color="#eeeeec"/></linearGradient></defs>
      <circle cx="${px}" cy="${py}" r="${R * .14}" fill="#e3dfd6" stroke="#cfc9bd"/>
      <line x1="${cwx}" y1="${cwy}" x2="${sx}" y2="${sy}" stroke="rgba(0,0,0,.18)" stroke-width="${R * .045}" stroke-linecap="round" transform="translate(6 8)"/>
      <line x1="${cwx}" y1="${cwy}" x2="${sx}" y2="${sy}" stroke="url(#metal)" stroke-width="${R * .035}" stroke-linecap="round"/>
      <circle cx="${cwx}" cy="${cwy}" r="${R * .07}" fill="#3a3632"/>
      <circle cx="${px}" cy="${py}" r="${R * .06}" fill="#2a2724"/>
      <line x1="${sx}" y1="${sy}" x2="${hx}" y2="${hy}" stroke="#2a2724" stroke-width="${R * .07}" stroke-linecap="round"/>
      <circle cx="${(sx + hx) / 2}" cy="${(sy + hy) / 2}" r="${R * .12}" fill="transparent"/>`;
  }
  function armTo(r) { armTarget = r; }
  function startArmDrag(ev) {
    ev.preventDefault(); dragArm = true;
    const move = (m) => {
      const b = plinth.getBoundingClientRect();
      const x = (m.clientX - b.left - G.cx) / G.R, y = (m.clientY - b.top - G.cy) / G.R;
      armTarget = armR = Math.max(R_IN - .02, Math.min(1.25, Math.hypot(x, y)));
      drawArm();
    };
    const up = () => {
      removeEventListener("pointermove", move); removeEventListener("pointerup", up); dragArm = false;
      if (armR > R_OUT + .04) { setPlay(false); return; }
      const i = Math.max(0, Math.min(N() - 1, Math.floor((R_OUT - armR) / ((R_OUT - R_IN) / N()))));
      cue(i, true);
    };
    addEventListener("pointermove", move); addEventListener("pointerup", up);
  }

  /* ---------------- Spin + scratch ---------------- */
  let rot = 0, vel = 0, scratching = false, lastA = 0, lastT = 0, rpm = 33.333;
  disc.addEventListener("pointerdown", (ev) => {
    scratching = true; disc.setPointerCapture(ev.pointerId); disc.style.cursor = "grabbing";
    const b = disc.getBoundingClientRect(); lastA = Math.atan2(ev.clientY - b.top - b.height / 2, ev.clientX - b.left - b.width / 2); lastT = performance.now();
  });
  disc.addEventListener("pointermove", (ev) => {
    if (!scratching) return;
    const b = disc.getBoundingClientRect(), a = Math.atan2(ev.clientY - b.top - b.height / 2, ev.clientX - b.left - b.width / 2);
    let d = a - lastA; if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI;
    const now = performance.now(); rot += d; vel = d / Math.max(1, now - lastT); lastA = a; lastT = now;
  });
  const endScratch = () => { scratching = false; disc.style.cursor = ""; };
  disc.addEventListener("pointerup", endScratch); disc.addEventListener("pointercancel", endScratch);

  function frame(t) {
    const target = playing && !scratching ? (rpm / 60) * 2 * Math.PI / 1000 : 0;
    if (!scratching) { vel += (target - vel) * (playing ? 0.02 : 0.03); rot += vel * 16.7; }
    if (!reduce) disc.style.transform = `rotate(${rot}rad)`;
    if (!dragArm && Math.abs(armTarget - armR) > .001) { armR += (armTarget - armR) * 0.08; drawArm(); }
    else if (!dragArm && playing && track >= 0 && !reduce) {
      // slow drift inward while a track plays
      const lo = trackR(track) - (R_OUT - R_IN) / N() + .04;
      if (armR > lo) { armR -= 0.000012 * 16.7; armTarget = armR; drawArm(); }
    }
    requestAnimationFrame(frame);
  }

  /* ---------------- Controls ---------------- */
  function setPlay(on) {
    playing = on; document.body.classList.toggle("playing", on);
    $("#play").setAttribute("aria-pressed", String(on)); $("#play").textContent = on ? "❚❚" : "▶";
    $("#play").setAttribute("aria-label", on ? "Pause" : "Play");
    $("#led").classList.toggle("on", on);
    if (on && track < 0) { cue(0, false); }
    if (!on) armTo(1.25);
    else if (track >= 0) armTo(Math.min(armR, trackR(track)));
    audio.setPlaying(on);
  }
  $("#play").onclick = () => setPlay(!playing);
  if (0) $("#speed").onclick = () => { const fast = rpm < 40; rpm = fast ? 45 : 33.333; $("#speed").setAttribute("aria-pressed", String(fast)); $("#rpm").textContent = fast ? "45" : "33⅓"; };

  function flip(to, switchTab) {
    if (to === side) return;
    const wasPlaying = playing; setPlay(false);
    rec.classList.remove("flip"); void rec.offsetWidth; rec.classList.add("flip");
    setTimeout(() => {
      side = to; track = -1; $("#sideLbl").textContent = side; drawDisc();
      if (switchTab) tab = side;
      renderTracks();
      $("#now").innerHTML = idleNow();
      if (wasPlaying) cue(0, true);
    }, reduce ? 0 : 550);
  }
  const idleNow = () => `<p class="k">Side ${side} · ${side === "A" ? "Experience" : "Projects"}</p><h2>${side === "A" ? "Where I've worked" : "What I'm building"}</h2>
    <p class="meta" style="font-size:16px;color:var(--ink)">↑ Choose a track above to play it.</p>`;

  /* ---------------- Sound (opt-in) ---------------- */
  const audio = (() => {
    let ac = null, master, noise, pad = [], on = false;
    const CHORDS = { A: [[57, 60, 64, 67], [53, 57, 60, 64], [55, 59, 62, 66], [52, 55, 59, 62]], B: [[50, 53, 57, 60], [55, 58, 62, 65], [48, 52, 55, 59], [53, 57, 60, 64]] };
    const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
    function init() {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
      const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1400; lp.connect(master);
      for (let i = 0; i < 4; i++) {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = i % 2 ? "triangle" : "sine"; g.gain.value = .08; o.connect(g); g.connect(lp); o.start(); pad.push(o);
        const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = .1 + i * .07; lg.gain.value = 2; lfo.connect(lg); lg.connect(o.detune); lfo.start();
      }
      // vinyl crackle
      const buf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() < .0008 ? (Math.random() * 2 - 1) * .9 : (Math.random() * 2 - 1) * .012;
      noise = ac.createBufferSource(); noise.buffer = buf; noise.loop = true;
      const ng = ac.createGain(); ng.gain.value = .5; noise.connect(ng); ng.connect(master); noise.start();
    }
    function level() { if (!ac) return; master.gain.setTargetAtTime(on && playing ? .5 : 0, ac.currentTime, .4); }
    return {
      toggle() { on = !on; if (on && !ac) init(); if (ac && ac.state === "suspended") ac.resume(); level(); return on; },
      setPlaying() { level(); },
      chord(i, s) { if (!ac) return; const ch = CHORDS[s][i % 4]; pad.forEach((o, k) => o.frequency.setTargetAtTime(hz(ch[k] - 12 * (k === 0)), ac.currentTime, .3)); },
    };
  })();
  $("#sound").onclick = () => { const on = audio.toggle(); $("#sound").setAttribute("aria-pressed", String(on)); $("#sound").textContent = on ? "♪ Music: on" : "♪ Music: off"; if (on && track >= 0) audio.chord(track, side); if (on && !playing) setPlay(true); };
  $("#prevT").onclick = () => cue(Math.max(0, track - 1), true);
  $("#nextT").onclick = () => { if (track >= N() - 1) flip(side === "A" ? "B" : "A", true); else cue(track + 1, true); };

  addEventListener("keydown", (ev) => {
    if (ev.target.closest && ev.target.closest("button, a")) return;
    if (ev.code === "Space") { ev.preventDefault(); setPlay(!playing); }
    if (ev.key === "ArrowDown" || ev.key === "ArrowRight") cue(Math.min(N() - 1, track + 1), true);
    if (ev.key === "ArrowUp" || ev.key === "ArrowLeft") cue(Math.max(0, track - 1), true);
  });

  // Intro: the record slides out of the sleeve onto the platter.
  if (!reduce) { rec.style.transform = "translateX(-70%) scale(.92)"; rec.style.opacity = ".0"; }
  renderTracks();
  $("#now").innerHTML = idleNow();
  let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(layout, 100); });
  const boot = () => {
    layout();
    requestAnimationFrame(() => { rec.style.transition = "transform 1.4s cubic-bezier(.2,.8,.2,1), opacity .6s"; rec.style.transform = ""; rec.style.opacity = ""; });
    const m = location.hash.match(/track=([AB])(\d)/);
    if (m) { if (m[1] !== side) { side = m[1]; tab = side; $("#sideLbl").textContent = side; drawDisc(); } cue(Math.max(0, +m[2] - 1), true); }
  };
  document.fonts ? document.fonts.ready.then(boot) : boot();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
