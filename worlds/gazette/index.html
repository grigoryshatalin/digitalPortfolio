<!DOCTYPE html>
<html lang="en" data-world="gazette" data-switcher="br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>The Shatalin Gazette — Grigory Shatalin</title>
<meta name="description" content="Grigory Shatalin, software engineer — all the news that's fit to ship." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Playfair+Display:ital,wght@0,700;0,900;1,400;1,700&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="../../shared/data.js"></script>
<script src="../../shared/kit.js"></script>
<style>
:root { --paper: #f3eee2; --ink: #1b1915; --mute: #5c564b; --rule: #1b1915; --head: "Playfair Display", Georgia, serif; --body: "Old Standard TT", Georgia, serif; }
* { box-sizing: border-box; }
html { background: #3b342c; }
body {
  margin: 0; min-height: 100vh; color: var(--ink); font-family: var(--body);
  background: radial-gradient(ellipse at 50% 0%, #5a4e40, #2c2620 70%);
  padding: clamp(10px, 3vw, 40px) clamp(8px, 2.5vw, 36px) 80px;
}
.stack { position: relative; max-width: 1180px; margin: 0 auto; perspective: 2600px; }
.page {
  position: relative; background: var(--paper);
  background-image:
    radial-gradient(circle at 15% 20%, rgba(255,255,255,.5), transparent 35%),
    radial-gradient(circle at 85% 75%, rgba(120,100,60,.08), transparent 40%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .25  0 0 0 0 .15  0 0 0 .06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  padding: clamp(16px, 3vw, 40px) clamp(14px, 3vw, 44px) 40px;
  box-shadow: 0 1px 0 #fff inset, 0 30px 60px rgba(0,0,0,.45), 0 4px 10px rgba(0,0,0,.25);
  transform-origin: left center; backface-visibility: hidden;
}
.page[hidden] { display: none; }
.page.turning-out { position: absolute; inset: 0 0 auto 0; z-index: 3; animation: turnOut .9s cubic-bezier(.55,.05,.45,1) forwards; }
.page.turning-in  { position: absolute; inset: 0 0 auto 0; z-index: 3; animation: turnIn .9s cubic-bezier(.55,.05,.45,1) forwards; }
@keyframes turnOut { 0% { transform: rotateY(0); filter: brightness(1); } 100% { transform: rotateY(-100deg); filter: brightness(.55); } }
@keyframes turnIn  { 0% { transform: rotateY(-100deg); filter: brightness(.55); } 100% { transform: rotateY(0); filter: brightness(1); } }

/* Masthead */
.mast { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; border-bottom: 1px solid var(--rule); padding-bottom: 6px; }
.ear { font-size: 12px; line-height: 1.35; border: 1px solid var(--rule); padding: 6px 8px; max-width: 200px; }
.ear b { display: block; font-family: var(--head); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
.ear.r { justify-self: end; text-align: right; }
.mast h1 { font-family: "UnifrakturMaguntia", serif; font-weight: 400; font-size: clamp(36px, 7.4vw, 92px); line-height: 1; margin: 0; text-align: center; letter-spacing: .01em; }
.dateline { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; border-bottom: 3px double var(--rule); padding: 5px 0; }
.sections { position: sticky; top: 0; z-index: 4; background: var(--paper); display: flex; gap: 0; border-bottom: 1px solid var(--rule); margin-bottom: 18px; overflow-x: auto; }
.sections button { all: unset; cursor: pointer; padding: 10px 16px; font-family: var(--head); font-size: 14px; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; border-right: 1px solid rgba(27,25,21,.25); }
.sections button[aria-current="true"] { background: var(--ink); color: var(--paper); }
.sections button:hover:not([aria-current="true"]), .sections button:focus-visible { background: rgba(27,25,21,.08); }
.sections button:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }

/* Typography */
.kicker { font-family: var(--head); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; margin: 0 0 6px; color: #8b1e1e; }
.hed { font-family: var(--head); font-weight: 900; line-height: .98; margin: 0 0 10px; letter-spacing: -.01em; }
.hed.xl { font-size: clamp(34px, 5.6vw, 72px); }
.hed.l { font-size: clamp(24px, 3vw, 36px); }
.hed.m { font-size: clamp(19px, 2vw, 24px); }
.hed.s { font-size: 17px; line-height: 1.1; }
.deck { font-family: var(--head); font-style: italic; font-weight: 400; font-size: clamp(16px, 1.7vw, 21px); line-height: 1.3; margin: 0 0 10px; color: #2c2924; }
.byline { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; margin: 0 0 12px; color: var(--mute); }
.cols { column-gap: 22px; column-rule: 1px solid rgba(27,25,21,.3); font-size: 15.5px; line-height: 1.55; text-align: justify; hyphens: auto; -webkit-hyphens: auto; }
.cols p { margin: 0 0 10px; }
.cols.c3 { column-count: 3; } .cols.c2 { column-count: 2; }
.drop::first-letter { float: left; font-family: var(--head); font-weight: 900; font-size: 64px; line-height: .8; padding: 6px 8px 0 0; }
.grid { display: grid; gap: 22px; }
.rule-t { border-top: 1px solid var(--rule); padding-top: 12px; }
.rule-l { border-left: 1px solid rgba(27,25,21,.3); padding-left: 22px; }
.front { grid-template-columns: 2.1fr 1fr; }
.below { grid-template-columns: repeat(3, 1fr); margin-top: 18px; }
figure { margin: 0 0 12px; }
figure canvas { width: 100%; height: auto; aspect-ratio: 2 / 1; display: block; background: var(--paper); filter: contrast(1.05); }
figcaption { font-size: 12px; font-style: italic; line-height: 1.35; color: var(--mute); padding-top: 5px; border-bottom: 1px solid rgba(27,25,21,.3); padding-bottom: 6px; }
.box { border: 1px solid var(--rule); padding: 12px 14px; margin-bottom: 16px; }
.box h3 { font-family: var(--head); font-size: 13px; letter-spacing: .18em; text-transform: uppercase; margin: 0 0 8px; border-bottom: 1px solid var(--rule); padding-bottom: 5px; }
.box ul { margin: 0; padding-left: 16px; font-size: 14px; line-height: 1.5; }
.box a, .cols a, .readmore { color: var(--ink); }
.pull { font-family: var(--head); font-style: italic; font-size: 24px; line-height: 1.2; border-top: 3px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 12px 0; margin: 4px 0 14px; text-align: center; break-inside: avoid; }
.tags { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
.readmore { font-family: var(--head); font-style: italic; }
.class-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border: 1px solid var(--rule); }
.ad { padding: 12px; border: 1px solid rgba(27,25,21,.4); font-size: 14px; line-height: 1.45; }
.ad h4 { font-family: var(--head); font-weight: 900; font-size: 18px; margin: 0 0 4px; text-transform: uppercase; letter-spacing: .02em; text-align: center; }
.ad .boxed { display: block; border: 2px solid var(--ink); text-align: center; padding: 4px; margin-top: 8px; font-family: var(--head); font-weight: 700; letter-spacing: .1em; font-size: 12px; text-transform: uppercase; }
.weather { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; gap: 6px; font-size: 13px; }
.weather svg { width: 34px; height: 34px; }
.folio { display: flex; justify-content: space-between; margin-top: 24px; padding-top: 6px; border-top: 1px solid var(--rule); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }
.turn { all: unset; cursor: pointer; font-family: var(--head); font-style: italic; text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--ink); }
.folio span:last-child .turn { font-style: normal; font-weight: 700; font-size: 15px; background: var(--ink); color: var(--paper); padding: 10px 16px; letter-spacing: .02em; }
.guide { border: 2px solid var(--ink); padding: 14px; }
.guide h3 { font-family: var(--head); font-size: 13px; letter-spacing: .2em; text-transform: uppercase; margin: 0 0 8px; }
.guide button { all: unset; cursor: pointer; display: flex; gap: 14px; align-items: center; width: 100%; box-sizing: border-box; padding: 12px 6px; border-top: 1px solid rgba(27,25,21,.25); }
.guide button b { font-family: var(--head); font-weight: 900; font-size: 30px; width: 34px; text-align: center; }
.guide button span { font-family: var(--head); font-weight: 700; font-size: 19px; line-height: 1.1; }
.guide button small { display: block; font-family: var(--body); font-weight: 400; font-size: 13px; color: var(--mute); margin-top: 3px; }
.guide button:hover, .guide button:focus-visible { background: rgba(27,25,21,.06); outline: none; }
.guide button.here { background: var(--ink); color: var(--paper); }
.guide button.here small { color: #cfc7b6; }
.turn:hover, .turn:focus-visible { text-decoration: underline; }
.ink { opacity: 0; transform: translateY(4px); filter: blur(2px); transition: opacity .8s ease, transform .8s ease, filter .8s ease; }
.page.inked .ink { opacity: 1; transform: none; filter: none; }
@media (max-width: 860px) {
  figure canvas { aspect-ratio: 4 / 3; }
  .front, .below { grid-template-columns: 1fr; }
  .rule-l { border-left: 0; padding-left: 0; border-top: 1px solid var(--rule); padding-top: 12px; }
  .cols.c3, .cols.c2 { column-count: 1; }
  .class-grid { grid-template-columns: 1fr 1fr; }
  .mast { grid-template-columns: 1fr; } .ear { display: none; }
  .dateline span:nth-child(n+3) { display: none; }
}
@media (max-width: 480px) { .class-grid { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { .page.turning-out, .page.turning-in { animation-duration: .01s; } .ink { transition: none; } }
</style>
</head>
<body>
<div class="stack" id="stack"></div>

<script>
(function () {
  const P = window.PORTFOLIO, K = window.Kit, e = K.esc;
  const ext = 'target="_blank" rel="noopener noreferrer"';
  const today = new Date();
  const dateStr = today.toLocaleDateString("en-US", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  const vol = today.getFullYear() - 2022;
  const roman = (n) => ["", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X"][n] || String(n);
  const [cur, ...past] = P.experience;
  const cu = P.education.find((d) => d.id === "cu"), lw = P.education.find((d) => d.id === "lwtech");
  const noDot = (s) => s.replace(/\.$/, "");

  const SECTIONS = [
    { id: "a", name: "A · Experience" },
    { id: "b", name: "B · Projects" },
    { id: "c", name: "C · Education" },
    { id: "d", name: "D · Skills & Contact" },
  ];

  const masthead = (sec, i) => `
    <header class="mast">
      <div></div>
      <h1>The Shatalin Gazette</h1>
      <div></div>
    </header>
    <div class="dateline"><span>Vol. ${roman(vol)} · No. ${today.getMonth() + 1}</span><span>${e(dateStr)}</span><span>${e(P.location)}</span><span>Price: Free</span></div>
    <nav class="sections" aria-label="Sections">${SECTIONS.map((s, k) => `<button type="button" data-go="${k}" ${k === i ? 'aria-current="true"' : ""}>${e(s.name)}</button>`).join("")}</nav>`;
  const folio = (i) => `<footer class="folio"><span>${i > 0 ? `<button class="turn" data-go="${i - 1}">← ${e(SECTIONS[i - 1].name)}</button>` : "The Shatalin Gazette"}</span><span>Section ${SECTIONS[i].id.toUpperCase()} · Page 1</span><span>${i < SECTIONS.length - 1 ? `<button class="turn" data-go="${i + 1}">Turn to ${e(SECTIONS[i + 1].name)} →</button>` : `<button class="turn" data-go="0">Back to the front page →</button>`}</span></footer>`;

  /* ---------- Page A: front ---------- */
  const pageA = `
    <div class="grid front">
      <article>
        <p class="kicker ink">${cur.current ? "Now in service" : "Latest"} · ${e(cur.location)}</p>
        <h2 class="hed xl ink">${e(P.last)} Joins ${e(cur.org)}${cur.team ? ` ${e(cur.team)} Team` : ""}</h2>
        <p class="deck ink">${e(cur.role)} builds ${e(noDot(cur.summary).replace(/^An? /, "an "))}.</p>
        <p class="byline ink">By the Gazette Staff · ${e(cur.dates)}</p>
        <figure class="ink"><canvas id="artSkyline"></canvas><figcaption>The mountain over the Eastside skyline, where ${e(P.first)} now works. Gazette illustration.</figcaption></figure>
        <div class="cols c2 ink">
          <p class="drop">${e(cur.bullets[0])}</p>
          ${cur.bullets.slice(1).map((b) => `<p>${e(b)}</p>`).join("")}
          <p class="tags">Filed under: ${e(cur.tags.join(" · "))}</p>
        </div>
      </article>
      <aside class="rule-l">
        <nav class="guide ink" aria-label="In this edition">
          <h3>In this edition</h3>
          <button type="button" data-go="0" class="here"><b>A</b><span>Experience<small>You are here</small></span></button>
          <button type="button" data-go="1"><b>B</b><span>Projects<small>Four things being built</small></span></button>
          <button type="button" data-go="2"><b>C</b><span>Education<small>CU Boulder · LWTech</small></span></button>
          <button type="button" data-go="3"><b>D</b><span>Skills &amp; contact<small>Classifieds · letters</small></span></button>
        </nav>
      </aside>
    </div>
    <div class="grid below rule-t">
      ${past.map((x, i) => `<article class="${i ? "rule-l" : ""} ink">
        <p class="kicker">${i === past.length - 1 ? "From the archives" : "Business"} · ${e(x.dates)}</p>
        <h3 class="hed m">${e(x.orgShort)}: ${e(noDot(x.summary))}</h3>
        <p class="byline">${e(x.role)} · ${e(x.location)}</p>
        <div class="cols" style="font-size:15px"><p>${e(x.bullets[0])}</p></div>
      </article>`).join("")}
    </div>`;

  /* ---------- Page B: technology ---------- */
  const [p0, ...pRest] = P.projects;
  const pageB = `
    <p class="kicker ink">Technology · Special report</p>
    <h2 class="hed xl ink">${P.projects.length} Projects on the Workbench</h2>
    <p class="deck ink">From a triathlon planner to a live-money trading bot, a tour of what ${e(P.first)} is building after hours.</p>
    <div class="grid front rule-t" style="margin-top:14px">
      <article class="ink">
        <p class="kicker">${e(p0.status)}</p>
        <h3 class="hed l">${e(p0.name)}: ${e(noDot(p0.tagline))}</h3>
        <div class="cols c2"><p class="drop">${e(p0.desc)}</p><p class="tags">Built with: ${e(p0.tags.join(" · "))}</p><p><a class="readmore" href="${e(p0.url)}" ${ext}>Read the source ↗</a></p></div>
      </article>
      <aside class="rule-l ink"><p class="pull">“${e(P.principles[1])}”</p><p style="font-size:14px;line-height:1.5;margin:0">The second of three working principles, published in full on page D1.</p></aside>
    </div>
    <div class="grid below rule-t">
      ${pRest.map((p, i) => `<article class="${i ? "rule-l" : ""} ink">
        <p class="kicker">${e(p.status)}</p>
        <h3 class="hed m">${e(p.name)}: ${e(noDot(p.tagline))}</h3>
        <div class="cols" style="font-size:14.5px"><p>${e(p.desc)}</p><p class="tags">${e(p.tags.join(" · "))}</p><p><a class="readmore" href="${e(p.url)}" ${ext}>Read the source ↗</a></p></div>
      </article>`).join("")}
    </div>`;

  /* ---------- Page C: campus ---------- */
  const pageC = `
    <p class="kicker ink">Campus · Boulder, Colo.</p>
    <h2 class="hed xl ink">${e(cu.degree)} on Track for ${e(cu.dates.replace(/^Expected /, ""))}</h2>
    <p class="deck ink">${e(P.first)} studies at the ${e(cu.school)} with a ${e(cu.gpa)} GPA, after finishing an associate degree at ${e(lw.schoolShort)}.</p>
    <div class="grid front rule-t" style="margin-top:14px">
      <article>
        <figure class="ink"><canvas id="artFlatirons"></canvas><figcaption>The Flatirons above Boulder, home of the Buffaloes. Gazette illustration.</figcaption></figure>
        <div class="cols c2 ink">
          <p class="drop">${e(cu.degree)}, ${e(cu.school)} — ${e(cu.location)}. ${e(cu.dates)}. GPA ${e(cu.gpa)}.</p>
          <p>Alongside coursework, ${e(P.first)} works as an ${e(P.experience.find((x) => x.id === "isat").role.toLowerCase())} at the ${e(P.experience.find((x) => x.id === "isat").org)}: ${e(P.experience.find((x) => x.id === "isat").bullets[0].charAt(0).toLowerCase() + P.experience.find((x) => x.id === "isat").bullets[0].slice(1))}</p>
          <p>Earlier: ${e(lw.degree)} at ${e(lw.school)}, ${e(lw.location)} — ${e(lw.dates)}, GPA ${e(lw.gpa)}.</p>
        </div>
      </article>
      <aside class="rule-l">
        <div class="box ink"><h3>Report card</h3>
          <table style="width:100%;border-collapse:collapse;font-size:14px">${P.education.map((d) => `<tr><td style="padding:6px 0;border-bottom:1px dotted #888"><b>${e(d.schoolShort)}</b><br><i>${e(d.degree)}</i></td><td style="text-align:right;border-bottom:1px dotted #888;font-family:var(--head);font-weight:900;font-size:22px">${e(d.gpa)}</td></tr>`).join("")}</table></div>
        <div class="box ink"><h3>Sports</h3><p style="margin:0;font-family:var(--head);font-weight:900;font-size:26px;text-align:center;line-height:1.05">GO BUFFS!</p></div>
      </aside>
    </div>`;

  /* ---------- Page D: opinion & classifieds ---------- */
  const pageD = `
    <div class="grid front">
      <article class="ink">
        <p class="kicker">Editorial</p>
        <h2 class="hed l">Three Rules for Building Things That Last</h2>
        <p class="byline">The editorial board of one</p>
        <div class="cols c3" style="column-count:1">
          ${P.principles.map((x, i) => `<p class="pull" style="text-align:left;font-size:${30 - i * 2}px">${i + 1}. ${e(x)}</p>`).join("")}
        </div>
      </article>
      <aside class="rule-l ink">
        <div class="box"><h3>Letters to the editor</h3><p style="margin:0 0 8px;font-size:14px;line-height:1.5">The Gazette welcomes correspondence. Write to ${e(P.name)}:</p>
          <ul>${P.contacts.map((c) => `<li><b>${e(c.label)}:</b> <a href="${e(c.href)}" ${c.id === "email" ? "" : ext}>${e(c.handle)}</a></li>`).join("")}</ul></div>
      </aside>
    </div>
    <div class="rule-t" style="margin-top:18px">
      <p class="kicker ink" style="text-align:center;font-size:14px;color:var(--ink)">— Classifieds —</p>
      <div class="class-grid ink">
        ${P.skills.map((s) => `<div class="ad"><h4>${e(s.group)}</h4>${s.items.map((x) => e(x)).join(" · ")}<span class="boxed">Available now</span></div>`).join("")}
      </div>
    </div>`;

  const PAGES = [pageA, pageB, pageC, pageD];
  const stack = document.getElementById("stack");
  stack.innerHTML = PAGES.map((html, i) => `<section class="page" id="pg${i}" ${i ? "hidden" : ""} aria-label="${e(SECTIONS[i].name)}">${masthead(SECTIONS[i], i)}${html}${folio(i)}</section>`).join("");

  /* ---------- Weather icons ---------- */
  function sun() { return `<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="7" fill="none" stroke="#1b1915" stroke-width="2"/>${[0, 45, 90, 135, 180, 225, 270, 315].map((a) => `<line x1="20" y1="5" x2="20" y2="9" stroke="#1b1915" stroke-width="2" transform="rotate(${a} 20 20)"/>`).join("")}</svg>`; }
  function cloud() { return `<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M11 28h19a6 6 0 0 0 0-12 8 8 0 0 0-15-2 6 6 0 0 0-4 14z" fill="none" stroke="#1b1915" stroke-width="2"/></svg>`; }

  /* ---------- Halftone illustrations ---------- */
  function halftone(canvas, scene) {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w) return;
    canvas.width = w * dpr; canvas.height = h * dpr;
    const c = canvas.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cell = 5, gw = Math.ceil(w / cell), gh = Math.ceil(h / cell);
    const off = document.createElement("canvas"); off.width = gw; off.height = gh;
    const o = off.getContext("2d"); scene(o, gw, gh);
    const d = o.getImageData(0, 0, gw, gh).data;
    c.fillStyle = "#f3eee2"; c.fillRect(0, 0, w, h);
    c.fillStyle = "#1b1915";
    for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
      const k = (y * gw + x) * 4, lum = (d[k] * .3 + d[k + 1] * .59 + d[k + 2] * .11) / 255;
      const r = (1 - lum) * cell * 0.62;
      if (r < .3) continue;
      const ox = (y % 2) * cell / 2;
      c.beginPath(); c.arc(x * cell + cell / 2 + ox, y * cell + cell / 2, r, 0, 7); c.fill();
    }
    c.strokeStyle = "#1b1915"; c.lineWidth = 1; c.strokeRect(.5, .5, w - 1, h - 1);
  }
  const rnd = (i) => { const x = Math.sin(i * 91.7) * 43758.5; return x - Math.floor(x); };
  function skyline(o, w, h) {
    const g = o.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "#fff"); g.addColorStop(.7, "#cfcfcf"); g.addColorStop(1, "#9a9a9a");
    o.fillStyle = g; o.fillRect(0, 0, w, h);
    // mountain
    const mg = o.createLinearGradient(0, h * .2, 0, h * .7); mg.addColorStop(0, "#d6d6d6"); mg.addColorStop(.3, "#8e8e8e"); mg.addColorStop(1, "#5e5e5e");
    o.fillStyle = mg; o.beginPath(); o.moveTo(w * .25, h * .72); o.lineTo(w * .5, h * .18); o.lineTo(w * .56, h * .24); o.lineTo(w * .62, h * .2); o.lineTo(w * .88, h * .72); o.fill();
    o.fillStyle = "#fff"; o.beginPath(); o.moveTo(w * .44, h * .3); o.lineTo(w * .5, h * .18); o.lineTo(w * .56, h * .24); o.lineTo(w * .62, h * .2); o.lineTo(w * .67, h * .32); o.lineTo(w * .58, h * .28); o.lineTo(w * .52, h * .34); o.fill();
    // water + skyline
    o.fillStyle = "#555"; o.fillRect(0, h * .86, w, h * .14);
    for (let i = 0, x = 0; x < w; i++) {
      const bw = 3 + rnd(i) * 6, bh = h * (.08 + rnd(i + 50) * (Math.abs(x - w * .55) < w * .2 ? .32 : .16));
      o.fillStyle = `rgb(${40 + rnd(i + 9) * 50},${40 + rnd(i + 9) * 50},${40 + rnd(i + 9) * 50})`;
      o.fillRect(x, h * .86 - bh, bw, bh);
      x += bw + (rnd(i + 3) > .7 ? 1 : 0);
    }
  }
  function flatirons(o, w, h) {
    const g = o.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "#fafafa"); g.addColorStop(1, "#d8d8d8");
    o.fillStyle = g; o.fillRect(0, 0, w, h);
    o.fillStyle = "#c4c4c4"; o.beginPath(); o.moveTo(0, h * .5);
    for (let x = 0; x <= w; x += 2) o.lineTo(x, h * (.42 - Math.sin(x / w * 6) * .05 - rnd(x) * .01)); o.lineTo(w, h); o.lineTo(0, h); o.fill();
    const slabs = [[.18, .14, .2], [.36, .1, .22], [.55, .16, .18], [.72, .22, .15]];
    slabs.forEach(([cx, top, half], i) => {
      const sg = o.createLinearGradient(w * (cx - half), 0, w * (cx + half), 0);
      sg.addColorStop(0, "#5c5c5c"); sg.addColorStop(.5, "#7a7a7a"); sg.addColorStop(1, "#3d3d3d");
      o.fillStyle = sg; o.beginPath(); o.moveTo(w * (cx - half), h * .78); o.lineTo(w * cx, h * top); o.lineTo(w * (cx + half * .7), h * .78); o.fill();
    });
    o.fillStyle = "#2e2e2e";
    for (let x = 0; x < w; x += 2) { const th = h * (.06 + rnd(x * 3) * .07); o.fillRect(x, h * .82 - th, 2, th + h * .2); }
  }
  function paintArt() {
    const a = document.getElementById("artSkyline"), b = document.getElementById("artFlatirons");
    if (a && a.offsetParent) halftone(a, skyline);
    if (b && b.offsetParent) halftone(b, flatirons);
  }

  /* ---------- Navigation with page turns ---------- */
  let cur_ = 0, busy = false;
  const pages = [...stack.querySelectorAll(".page")];
  function ink(i) { const p = pages[i]; p.classList.remove("inked"); void p.offsetWidth; requestAnimationFrame(() => p.classList.add("inked")); }
  function go(i) {
    if (i === cur_ || busy) return;
    const out = pages[cur_], inn = pages[i], fwd = i > cur_;
    history.replaceState(null, "", "#" + SECTIONS[i].id);
    if (K.reduceMotion || innerWidth < 600) {
      out.hidden = true; inn.hidden = false; cur_ = i; scrollTo(0, 0); paintArt(); ink(i); return;
    }
    busy = true;
    scrollTo({ top: 0, behavior: "smooth" });
    inn.hidden = false;
    if (fwd) { out.classList.add("turning-out"); }
    else { inn.classList.add("turning-in"); out.style.position = "absolute"; out.style.inset = "0 0 auto 0"; }
    paintArt(); ink(i);
    setTimeout(() => {
      out.classList.remove("turning-out"); inn.classList.remove("turning-in");
      out.style.position = ""; out.style.inset = "";
      out.hidden = true; cur_ = i; busy = false;
    }, 920);
  }
  document.addEventListener("click", (ev) => { const b = ev.target.closest("[data-go]"); if (b) go(+b.dataset.go); });
  addEventListener("keydown", (ev) => {
    if (ev.key === "ArrowRight") go(Math.min(PAGES.length - 1, cur_ + 1));
    if (ev.key === "ArrowLeft") go(Math.max(0, cur_ - 1));
  });
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(paintArt, 150); });

  const start = SECTIONS.findIndex((s) => "#" + s.id === location.hash);
  if (start > 0) { pages[0].hidden = true; pages[start].hidden = false; cur_ = start; }
  const boot = () => { paintArt(); ink(cur_); };
  document.fonts ? document.fonts.ready.then(boot) : boot();
})();
</script>
</body>
</html>
