<!DOCTYPE html>
<html lang="en" data-world="train" data-switcher="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>The Midnight Limited — Grigory Shatalin</title>
<meta name="description" content="Grigory Shatalin, software engineer — a particle train, one station per chapter." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="../../shared/data.js"></script>
<script src="../../shared/kit.js"></script>
<style>
:root { --bg: #0a0a0b; --fg: #f4f4f2; --mute: #8b8b90; --line: rgba(244,244,242,.14); --accent: #ff6a3d; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

.copy { position: fixed; left: clamp(20px, 7vw, 120px); top: clamp(72px, 14vh, 150px); width: min(560px, calc(100vw - 40px)); z-index: 2; }
.eyebrow { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--mute); margin: 0 0 18px; display: flex; gap: 10px; align-items: center; }
.eyebrow i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
h1, h2 { font-weight: 500; letter-spacing: -.035em; line-height: .98; margin: 0; }
h1 { font-size: clamp(44px, 7vw, 92px); }
h2 { font-size: clamp(36px, 5.4vw, 70px); }
.sub { font-size: clamp(15px, 1.3vw, 18px); color: #c9c9c6; line-height: 1.55; margin: 18px 0 0; max-width: 46ch; font-weight: 300; }
.meta { font-size: 13px; color: var(--mute); margin: 12px 0 0; }
.list { list-style: none; margin: 22px 0 0; padding: 0; display: grid; gap: 10px; }
.list li { font-size: 14px; line-height: 1.55; color: #c9c9c6; padding-left: 18px; position: relative; font-weight: 300; }
.list li::before { content: ""; position: absolute; left: 0; top: .7em; width: 8px; height: 1px; background: var(--mute); }
.list b { color: var(--fg); font-weight: 500; }
.list a, .links a { color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--line); transition: border-color .2s; }
.list a:hover, .links a:hover, .list a:focus-visible, .links a:focus-visible { border-color: var(--fg); outline: none; }
.links { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 22px 0 0; font-size: 14px; }
.next {
  margin-top: 30px; display: inline-flex; align-items: center; gap: 12px; padding: 12px 18px 12px 20px; border-radius: 99px;
  background: var(--fg); color: var(--bg); border: 0; font: 500 14px Inter, sans-serif; cursor: pointer; transition: transform .2s;
}
.next:hover { transform: translateX(3px); }
.next:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.next span { transition: transform .2s; }
.next:hover span { transform: translateX(3px); }
.hint { display: inline-block; margin-left: 14px; font-size: 12px; color: var(--mute); }

.copy > * { transition: opacity .55s ease, transform .7s cubic-bezier(.2,.7,.2,1); }
.copy.out > * { opacity: 0; transform: translateX(-24px); }
.copy.in > * { opacity: 0; transform: translateX(24px); transition: none; }
.copy > *:nth-child(2) { transition-delay: .04s; } .copy > *:nth-child(3) { transition-delay: .08s; } .copy > *:nth-child(4) { transition-delay: .12s; } .copy > *:nth-child(5) { transition-delay: .16s; } .copy > *:nth-child(6) { transition-delay: .2s; }

.stations { position: fixed; left: clamp(20px, 7vw, 120px); right: clamp(20px, 7vw, 120px); bottom: max(26px, env(safe-area-inset-bottom)); z-index: 2; }
.stations ol { list-style: none; margin: 0; padding: 0; display: flex; justify-content: space-between; position: relative; }
.stations ol::before { content: ""; position: absolute; left: 0; right: 0; top: 4px; height: 1px; background: var(--line); }
.stations .bar { position: absolute; left: 0; top: 4px; height: 1px; background: var(--fg); transition: width 1.3s cubic-bezier(.65,0,.35,1); }
.stations button { all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 11px; color: var(--mute); letter-spacing: .04em; position: relative; }
.stations li:first-child button { align-items: flex-start; } .stations li:last-child button { align-items: flex-end; }
.stations button::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--bg); border: 1px solid var(--mute); transition: all .3s; }
.stations button:hover, .stations button:focus-visible { color: var(--fg); }
.stations button[aria-current="true"] { color: var(--fg); }
.stations button[aria-current="true"]::before { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 12px var(--accent); }
.stations button.done::before { background: var(--fg); border-color: var(--fg); }
@media (max-width: 760px) {
  .copy { top: 64px; }
  .stations button span { display: none; }
  .stations button[aria-current="true"] span { display: block; position: absolute; top: 18px; white-space: nowrap; }
  .stations li:first-child button[aria-current="true"] span { left: 0; } .stations li:last-child button[aria-current="true"] span { right: 0; }
  .hint { display: none; }
  .list { gap: 8px; } .list li { font-size: 13.5px; }
}
@media (prefers-reduced-motion: reduce) { .copy > * { transition: none; } }
</style>
</head>
<body>
<canvas id="cv" aria-hidden="true"></canvas>
<main class="copy" id="copy" aria-live="polite"></main>
<nav class="stations" aria-label="Stations"><ol id="stations"><span class="bar" id="bar"></span></ol></nav>

<script>
(function () {
  const P = window.PORTFOLIO, K = window.Kit, e = K.esc;
  const $ = (s) => document.querySelector(s);
  const reduce = K.reduceMotion;
  const ext = 'target="_blank" rel="noopener noreferrer"';

  /* ---------------- Stations (one idea each) ---------------- */
  const S = [];
  S.push({ name: "Departure", html: `
    <p class="eyebrow"><i></i>The Midnight Limited</p>
    <h1>${e(P.first)}<br>${e(P.last)}</h1>
    <p class="sub">${e(P.intro)}</p>
    <p class="links">${P.contacts.map((c) => `<a href="${e(c.href)}" ${c.id === "email" ? "" : ext}>${e(c.label)}</a>`).join("")}</p>` });
  P.experience.forEach((x) => S.push({ name: x.orgShort, html: `
    <p class="eyebrow"><i></i>${x.current ? "Now" : "Previously"} · ${e(x.dates)}</p>
    <h2>${e(x.org)}</h2>
    <p class="meta">${e(x.role)}${x.team ? " · " + e(x.team) : ""} · ${e(x.location)}</p>
    <p class="sub">${e(x.summary)}</p>
    <p class="meta" style="margin-top:22px">${e(x.tags.join("  ·  "))}</p>` }));
  S.push({ name: "Education", html: `
    <p class="eyebrow"><i></i>Education</p>
    <h2>${e(P.education[0].schoolShort)}</h2>
    <p class="sub">${e(P.education[0].degree)} · ${e(P.education[0].dates)} · GPA ${e(P.education[0].gpa)}</p>
    <ul class="list">${P.education.slice(1).map((d) => `<li><b>${e(d.schoolShort)}</b> — ${e(d.degree)}, ${e(d.dates)} · GPA ${e(d.gpa)}</li>`).join("")}</ul>` });
  S.push({ name: "Projects", html: `
    <p class="eyebrow"><i></i>Projects</p>
    <h2>Things I'm building</h2>
    <ul class="list">${P.projects.map((p) => `<li><a href="${e(p.url)}" ${ext}><b>${e(p.name)}</b></a> — ${e(p.tagline)}</li>`).join("")}</ul>` });
  S.push({ name: "Arrival", html: `
    <p class="eyebrow"><i></i>Last stop</p>
    <h2>Let's talk.</h2>
    <p class="sub">${e(P.skills.map((s) => s.items.slice(0, 3).join(", ")).join(" · "))}</p>
    <p class="links" style="font-size:16px">${P.contacts.map((c) => `<a href="${e(c.href)}" ${c.id === "email" ? "" : ext}>${e(c.label)}</a>`).join("")}</p>` });

  const copy = $("#copy"), list = $("#stations");
  list.insertAdjacentHTML("beforeend", S.map((s, i) => `<li><button type="button" data-i="${i}" aria-label="Station ${i + 1}: ${e(s.name)}"><span>${e(s.name)}</span></button></li>`).join(""));
  const btns = [...list.querySelectorAll("button")];

  let cur = -1, busy = false;
  function render(i) {
    const last = i === S.length - 1;
    copy.innerHTML = S[i].html + `<div><button class="next" id="next" type="button">${last ? "Back to departure" : "Next station"} <span>${last ? "↺" : "→"}</span></button>${i === 0 ? '<span class="hint">or scroll · ← →</span>' : ""}</div>`;
    $("#next").onclick = () => go(last ? 0 : i + 1);
    btns.forEach((b, k) => { b.setAttribute("aria-current", String(k === i)); b.classList.toggle("done", k < i); });
    const ri = btns[i].getBoundingClientRect(), rl = list.getBoundingClientRect();
    $("#bar").style.width = Math.max(0, (i === 0 ? 0 : ri.left + (i === S.length - 1 ? ri.width : ri.width / 2) - rl.left)) + "px";
  }
  function go(i) {
    i = Math.max(0, Math.min(S.length - 1, i));
    if (i === cur || busy) return;
    const dir = i > cur ? 1 : -1, first = cur < 0;
    cur = i; if (!first) travel(dir);
    history.replaceState(null, "", "#" + i);
    if (first || reduce) { render(i); return; }
    busy = true;
    copy.classList.add("out");
    setTimeout(() => {
      render(i); copy.classList.remove("out"); copy.classList.add("in");
      requestAnimationFrame(() => requestAnimationFrame(() => copy.classList.remove("in")));
      setTimeout(() => { busy = false; }, 500);
    }, 650);
  }
  list.addEventListener("click", (ev) => { const b = ev.target.closest("button"); if (b) go(+b.dataset.i); });
  addEventListener("keydown", (ev) => {
    if (ev.key === "ArrowRight" || ev.key === "ArrowDown" || ev.key === "PageDown") { ev.preventDefault(); go(cur + 1); }
    if (ev.key === "ArrowLeft" || ev.key === "ArrowUp" || ev.key === "PageUp") { ev.preventDefault(); go(cur - 1); }
  });
  let wheelLock = 0, wAcc = 0;
  addEventListener("wheel", (ev) => {
    const now = performance.now(); if (now < wheelLock) return;
    wAcc += Math.abs(ev.deltaY) > Math.abs(ev.deltaX) ? ev.deltaY : ev.deltaX;
    if (Math.abs(wAcc) > 60) { go(cur + (wAcc > 0 ? 1 : -1)); wAcc = 0; wheelLock = now + 1300; }
  }, { passive: true });
  let tx = null, ty = null;
  addEventListener("touchstart", (ev) => { tx = ev.touches[0].clientX; ty = ev.touches[0].clientY; }, { passive: true });
  addEventListener("touchend", (ev) => {
    if (tx == null) return;
    const dx = ev.changedTouches[0].clientX - tx, dy = ev.changedTouches[0].clientY - ty; tx = null;
    if (ev.target.closest("a,button")) return;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) go(cur + (dx < 0 ? 1 : -1));
    else if (Math.abs(dy) > 60) go(cur + (dy < 0 ? 1 : -1));
  });

  /* ---------------- Particle train ---------------- */
  const cv = $("#cv"), c = cv.getContext("2d");
  let W, H, DPR, pts = [], dust = [], trackY, trainBox;
  let speed = 0, scrollX = 0, mx = -1e4, my = -1e4;
  addEventListener("pointermove", (ev) => { mx = ev.clientX; my = ev.clientY; }, { passive: true });

  function trainShape(w, h) {
    // A streamlined two-car train drawn into an offscreen canvas, then sampled.
    const off = document.createElement("canvas"); off.width = w; off.height = h;
    const o = off.getContext("2d");
    o.fillStyle = "#fff";
    const carH = h * .62, y0 = h * .14, gap = w * .012, loco = w * .44, car = w - loco - gap;
    const rr = (x, y, ww, hh, r) => { o.beginPath(); o.moveTo(x + r, y); o.lineTo(x + ww - r, y); o.quadraticCurveTo(x + ww, y, x + ww, y + r); o.lineTo(x + ww, y + hh); o.lineTo(x, y + hh); o.lineTo(x, y + r); o.quadraticCurveTo(x, y, x + r, y); o.fill(); };
    rr(0, y0, car, carH, h * .12);
    o.beginPath();
    o.moveTo(car + gap, y0 + h * .12);
    o.quadraticCurveTo(car + gap, y0, car + gap + h * .12, y0);
    o.lineTo(car + gap + loco * .5, y0);
    o.bezierCurveTo(car + gap + loco * .86, y0, w, y0 + carH * .55, w, y0 + carH * .86);
    o.lineTo(w, y0 + carH); o.lineTo(car + gap, y0 + carH); o.closePath(); o.fill();
    o.globalCompositeOperation = "destination-out";
    const wy = y0 + carH * .22, wh = carH * .26;
    for (let x = h * .2; x < car - h * .25; x += h * .42) o.fillRect(x, wy, h * .3, wh);
    for (let x = car + gap + h * .25; x < car + gap + loco * .48; x += h * .42) o.fillRect(x, wy, h * .3, wh);
    o.beginPath(); o.moveTo(car + gap + loco * .56, wy); o.lineTo(car + gap + loco * .78, wy); o.lineTo(car + gap + loco * .88, wy + wh); o.lineTo(car + gap + loco * .56, wy + wh); o.fill();
    o.fillRect(0, y0 + carH * .72, w, carH * .05);
    o.globalCompositeOperation = "source-over";
    const wr = h * .09;
    [car * .15, car * .85, car + gap + loco * .2, car + gap + loco * .62].forEach((x) => { o.beginPath(); o.arc(x, y0 + carH + wr * .6, wr, 0, 7); o.fill(); });
    return o.getImageData(0, 0, w, h).data;
  }

  function build() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR; c.setTransform(DPR, 0, 0, DPR, 0, 0);
    const narrow = W < 760;
    const tw = Math.round(Math.min(W * (narrow ? .92 : .6), 960)), th = Math.round(tw * .2);
    trackY = H - (narrow ? 104 : 118);
    const x0 = narrow ? (W - tw) / 2 : W - tw - W * .05, y0 = trackY - th + th * .04;
    trainBox = { x0, y0, tw, th };
    const data = trainShape(tw, th);
    const step = Math.max(3, Math.round(tw / 260));
    const old = pts;
    pts = [];
    for (let y = 0; y < th; y += step) for (let x = 0; x < tw; x += step) {
      if (data[(y * tw + x) * 4 + 3] > 128) {
        const p = old[pts.length] || { x: Math.random() * W, y: Math.random() * H, vx: 0, vy: 0, d: Math.random() };
        p.tx = x0 + x; p.ty = y0 + y; p.ux = x / tw; p.r = .8 + Math.random() * .7;
        pts.push(p);
      }
    }
    dust = Array.from({ length: Math.round(W / 9) }, () => ({ x: Math.random() * W, y: Math.random() * (trackY - 40), z: .2 + Math.random() * .8 }));
  }

  // A trip: speed ramps up, cruises, and brakes while the world scrolls past.
  let trip = null;
  function travel(dir) { if (!reduce) trip = { t0: performance.now(), dir, dur: 1500 }; }

  function frame(now) {
    if (trip) {
      const k = (now - trip.t0) / trip.dur;
      if (k >= 1) { trip = null; speed = 0; }
      else speed = trip.dir * Math.pow(Math.sin(Math.PI * k), 1.5) * 34;
    }
    scrollX += speed;
    c.clearRect(0, 0, W, H);

    for (const d of dust) {
      d.x -= speed * d.z * .9 + .08 * d.z;
      if (d.x < -40) d.x += W + 80; if (d.x > W + 40) d.x -= W + 80;
      const len = Math.abs(speed) * d.z * 1.6;
      c.fillStyle = `rgba(244,244,242,${.12 + d.z * .2})`;
      c.fillRect(d.x - (speed > 0 ? 0 : len), d.y, Math.max(1, len), 1);
    }

    c.fillStyle = "rgba(244,244,242,.32)"; c.fillRect(0, trackY + 6, W, 1);
    const sp = 22, off = ((scrollX % sp) + sp) % sp;
    c.fillStyle = "rgba(244,244,242,.12)";
    for (let x = -off; x < W; x += sp) c.fillRect(x, trackY + 9, 10, 2);

    const t = now * .001;
    for (const p of pts) {
      const lag = speed * (1 - p.ux) * 1.4;
      const bob = Math.sin(t * 3 + p.ux * 6) * .25;
      let ax = (p.tx - lag - p.x) * .06, ay = (p.ty + bob - p.y) * .06;
      const dx = p.x - mx, dy = p.y - my, d2 = dx * dx + dy * dy;
      if (d2 < 6400) { const f = (1 - Math.sqrt(d2) / 80) * 2.2; ax += dx / 80 * f; ay += dy / 80 * f; }
      p.vx = (p.vx + ax) * .78; p.vy = (p.vy + ay) * .78;
      p.x += p.vx; p.y += p.vy;
      const a = .55 + .45 * Math.pow(Math.sin(t * 2 + p.d * 9), 2);
      c.fillStyle = `rgba(244,244,242,${a})`;
      c.fillRect(p.x, p.y, p.r + Math.abs(speed) * .08, p.r);
    }
    const hx = trainBox.x0 + trainBox.tw - 4, hy = trainBox.y0 + trainBox.th * .66;
    const g = c.createRadialGradient(hx, hy, 0, hx, hy, 46);
    g.addColorStop(0, "rgba(255,106,61,.9)"); g.addColorStop(.15, "rgba(255,106,61,.35)"); g.addColorStop(1, "rgba(255,106,61,0)");
    c.fillStyle = g; c.fillRect(hx - 46, hy - 46, 92, 92);

    requestAnimationFrame(frame);
  }

  addEventListener("resize", () => { build(); if (cur >= 0) render(cur); });
  build();
  const start = Math.min(S.length - 1, Math.max(0, parseInt(location.hash.slice(1), 10) || 0));
  if (reduce) pts.forEach((p) => { p.x = p.tx; p.y = p.ty; });
  go(start);
  document.fonts && document.fonts.ready.then(() => render(cur));
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
