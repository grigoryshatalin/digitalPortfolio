<!DOCTYPE html>
<html lang="en" data-world="pixel" data-switcher="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Shatalin Town — Grigory Shatalin</title>
<meta name="description" content="Grigory Shatalin, software engineer — a tiny pixel town. Walk into any building to explore a chapter." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="../../shared/data.js"></script>
<script src="../../shared/kit.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #17131f; color: #fff; font-family: "Press Start 2P", monospace; -webkit-tap-highlight-color: transparent; }
canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; display: block; touch-action: none; }
.px-box { background: #fdf6e3; color: #2b2135; border: 4px solid #2b2135; box-shadow: inset 0 0 0 4px #e8d5a9, 0 6px 0 rgba(0,0,0,.35); }
.dialog { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(720px, calc(100vw - 24px)); min-height: 132px; padding: 22px 26px 26px; z-index: 20; font-size: clamp(10px, 1.4vw, 13px); line-height: 2; }
.dialog[hidden], .menu[hidden], .title[hidden] { display: none; }
.dialog .who { position: absolute; top: -18px; left: 18px; padding: 6px 10px; font-size: 10px; background: #2b2135; color: #fdf6e3; }
.dialog .more { position: absolute; right: 16px; bottom: 10px; animation: bob .6s steps(2) infinite; }
@keyframes bob { 50% { transform: translateY(3px); } }
.choices { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 4px; }
.choices button, .menu button { all: unset; cursor: pointer; display: block; padding: 4px 8px 4px 22px; position: relative; }
.choices button:focus-visible, .choices button:hover, .menu button:focus-visible, .menu button:hover { background: #2b2135; color: #fdf6e3; }
.choices button:focus-visible::before, .choices button:hover::before, .menu button:focus-visible::before, .menu button:hover::before { content: "▶"; position: absolute; left: 6px; }
.hud { position: fixed; left: max(14px, env(safe-area-inset-left)); top: max(14px, env(safe-area-inset-top)); z-index: 10; display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; max-width: calc(100vw - 120px); }
.hud button { cursor: pointer; padding: 10px 12px; font: inherit; font-size: 10px; }
.hud button:focus-visible { outline: 3px solid #ffd75e; outline-offset: 2px; }
.goal { padding: 10px 12px; font-size: 10px; display: flex; align-items: center; gap: 8px; }
.goal b { color: #b34a2a; }
.place { position: fixed; left: 50%; top: max(14px, env(safe-area-inset-top)); transform: translateX(-50%); z-index: 9; padding: 10px 14px; font-size: 11px; text-align: center; transition: opacity .3s; max-width: calc(100vw - 260px); }
.place small { display: block; font-size: 8px; color: #8a7a6a; margin-top: 6px; line-height: 1.6; }
.place.hide { opacity: 0; }
.menu { position: fixed; left: max(14px, env(safe-area-inset-left)); top: calc(max(14px, env(safe-area-inset-top)) + 54px); z-index: 30; width: min(320px, calc(100vw - 28px)); padding: 16px 12px; font-size: 10px; line-height: 1.6; max-height: 70vh; overflow: auto; }
.menu h2 { font-size: 11px; margin: 4px 8px 10px; }
.menu .ok { color: #3f8f6b; }
.title { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; text-align: center; cursor: pointer; padding: 20px; background: radial-gradient(ellipse at center, rgba(23,19,31,.6), rgba(23,19,31,.94)); }
.title h1 { font-size: clamp(22px, 5vw, 54px); margin: 0 0 22px; color: #ffd75e; text-shadow: 4px 4px 0 #b34a2a, 8px 8px 0 #2b2135; line-height: 1.3; }
.title p { font-size: clamp(9px, 1.3vw, 12px); margin: 8px auto; line-height: 2; max-width: 46ch; }
.title .how { display: inline-grid; grid-template-columns: auto auto; gap: 10px 16px; text-align: left; margin: 18px auto 0; font-size: clamp(9px, 1.1vw, 11px); color: #e6dcc8; }
.title .how b { color: #ffd75e; font-weight: 400; }
.title .blink { animation: blink 1s steps(2) infinite; color: #fff; margin-top: 26px; }
@keyframes blink { 50% { opacity: 0; } }
.pad { position: fixed; z-index: 10; display: none; touch-action: none; user-select: none; -webkit-user-select: none; }
.dpad { left: max(16px, env(safe-area-inset-left)); bottom: calc(max(16px, env(safe-area-inset-bottom)) + 8px); width: 132px; height: 132px; }
.dpad button { position: absolute; width: 44px; height: 44px; border: 0; background: rgba(43,33,53,.82); color: #fdf6e3; font: inherit; font-size: 12px; border-radius: 6px; }
.dpad .u { left: 44px; top: 0; } .dpad .d { left: 44px; bottom: 0; } .dpad .l { left: 0; top: 44px; } .dpad .r { right: 0; top: 44px; }
.abtn { right: max(20px, env(safe-area-inset-right)); bottom: calc(max(20px, env(safe-area-inset-bottom)) + 36px); }
.abtn button { width: 64px; height: 64px; border-radius: 50%; border: 0; background: #b34a2a; color: #fdf6e3; font: inherit; font-size: 14px; box-shadow: 0 5px 0 #6e2a16; }
@media (pointer: coarse) { .pad { display: block; } }
body.talking .pad { display: none; }
@media (max-width: 700px) { .place { top: auto; bottom: 190px; max-width: calc(100vw - 28px); } .hud { max-width: calc(100vw - 100px); } }
</style>
</head>
<body>
<canvas id="game" aria-label="Shatalin Town — a pixel map. Use the Map button for a list of every place."></canvas>
<div class="hud">
  <button class="px-box" id="menuBtn" aria-expanded="false" aria-controls="menu">≡ MAP</button>
  <div class="goal px-box" id="goal" aria-live="polite"></div>
</div>
<div class="place px-box hide" id="place" aria-live="polite"></div>
<nav class="menu px-box" id="menu" hidden aria-label="Town directory"></nav>
<div class="pad dpad" aria-hidden="true">
  <button class="u" data-dir="up">▲</button><button class="l" data-dir="left">◀</button>
  <button class="r" data-dir="right">▶</button><button class="d" data-dir="down">▼</button>
</div>
<div class="pad abtn" aria-hidden="true"><button id="aBtn">A</button></div>
<section class="dialog px-box" id="dialog" hidden aria-live="polite">
  <span class="who" id="who"></span>
  <div id="dtext"></div>
  <ul class="choices" id="choices"></ul>
  <span class="more" id="more" aria-hidden="true">▼</span>
</section>
<div class="title" id="title" role="button" tabindex="0" aria-label="Start">
  <div>
    <h1>SHATALIN<br>TOWN</h1>
    <p>Every building is a chapter of Grigory's career.<br>Walk through a door to go inside.</p>
    <div class="how">
      <b>MOVE</b><span>Arrows / WASD — or tap where to go</span>
      <b>TALK</b><span>Space / A — next to anything with a !</span>
      <b>GOAL</b><span>Visit all the buildings with a ▼</span>
    </div>
    <p class="blink">PRESS START</p>
  </div>
</div>

<script>
(function () {
  const P = window.PORTFOLIO, K = window.Kit, e = K.esc;
  const $ = (s) => document.querySelector(s);
  K.srSummary();

  /* ================= Town map ================= */
  const TS = 16, MW = 40, MH = 30;
  const G = { GRASS: 0, PATH: 1, WATER: 2, TREE: 3, BLD: 4, FLOWER: 5, FENCE: 6 };
  const map = new Array(MW * MH).fill(G.GRASS);
  const at = (x, y) => (x < 0 || y < 0 || x >= MW || y >= MH) ? G.TREE : map[y * MW + x];
  const set = (x, y, v) => { if (x >= 0 && y >= 0 && x < MW && y < MH) map[y * MW + x] = v; };
  const hash = (x, y, s = 0) => { const n = Math.sin(x * 127.1 + y * 311.7 + s * 74.7) * 43758.5453; return n - Math.floor(n); };
  const exp = Object.fromEntries(P.experience.map((x) => [x.id, x]));
  const edu = Object.fromEntries(P.education.map((x) => [x.id, x]));

  const B = [
    { id: "isat",    x: 3,  y: 2, w: 6, h: 5, door: 6,  name: "iSAT Lab",       sign: "iSAT LAB", wall: "#e9e4d4", roof: "#4a6fa5", kind: "lab", what: "Research" },
    { id: "akvelon", x: 11, y: 3, w: 5, h: 4, door: 13, name: "Akvelon Office",  sign: "AKVELON",  wall: "#e7dcc6", roof: "#3f8f6b", what: "First internship" },
    { id: "circle",  x: 22, y: 3, w: 5, h: 4, door: 24, name: "Circle Bank",     sign: "CIRCLE",   wall: "#eef0f4", roof: "#6c5ce7", kind: "bank", what: "Internship" },
    { id: "aws",     x: 29, y: 1, w: 7, h: 6, door: 32, name: "AWS Tower",       sign: "AWS",      wall: "#2f3542", roof: "#ff9f1a", kind: "tower", what: "Current job" },
    { id: "library", x: 4,  y: 10, w: 5, h: 4, door: 6, name: "Skill Library",   sign: "LIBRARY",  wall: "#e8d9bf", roof: "#8e3b46", what: "Skills" },
    { id: "home",    x: 13, y: 10, w: 5, h: 4, door: 15, name: "Grigory's House", sign: "HOME",    wall: "#f3e2c4", roof: "#c0392b", what: "About" },
    { id: "post",    x: 22, y: 10, w: 5, h: 4, door: 24, name: "Post Office",     sign: "POST",    wall: "#e6e1d6", roof: "#2d6cdf", what: "Contact" },
    { id: "cu",      x: 3,  y: 18, w: 8, h: 5, door: 7, name: "CU Boulder",       sign: "CU BOULDER", wall: "#d9b48a", roof: "#b5482f", kind: "campus", what: "University" },
    { id: "lwtech",  x: 13, y: 19, w: 5, h: 4, door: 15, name: "LWTech",          sign: "LWTECH",  wall: "#e2e6ea", roof: "#1f6f8b", what: "College" },
    { id: "workshop",x: 29, y: 18, w: 7, h: 4, door: 32, name: "The Workshop",    sign: "WORKSHOP", wall: "#c9b69a", roof: "#5d4e3c", kind: "shed", what: "Projects" },
  ];
  const byId = Object.fromEntries(B.map((b) => [b.id, b]));

  for (let x = 2; x <= 37; x++) { set(x, 7, G.PATH); set(x, 8, G.PATH); set(x, 15, G.PATH); set(x, 16, G.PATH); set(x, 25, G.PATH); }
  for (let y = 7; y <= 25; y++) { set(19, y, G.PATH); set(20, y, G.PATH); }
  B.forEach((b) => { const dy = b.y + b.h; for (let y = dy; y < MH; y++) { if (at(b.door, y) === G.PATH) break; set(b.door, y, G.PATH); } });
  for (let y = 19; y <= 23; y++) for (let x = 22; x <= 26; x++) { const dx = (x - 24) / 2.6, dy = (y - 21) / 2.2; if (dx * dx + dy * dy <= 1) set(x, y, G.WATER); }
  B.forEach((b) => { for (let y = b.y; y < b.y + b.h; y++) for (let x = b.x; x < b.x + b.w; x++) set(x, y, G.BLD); });
  for (let x = 29; x <= 35; x++) { set(x, 10, G.FENCE); set(x, 13, G.FENCE); }
  for (let y = 10; y <= 13; y++) { set(29, y, G.FENCE); set(35, y, G.FENCE); }
  for (let y = 11; y <= 12; y++) for (let x = 30; x <= 34; x++) set(x, y, G.FLOWER);
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    if (x < 2 || y < 1 || x > 37 || y > 27) { if (at(x, y) !== G.PATH) set(x, y, G.TREE); continue; }
    if (at(x, y) !== G.GRASS) continue;
    let near = false;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const t = at(x + dx, y + dy); if (t === G.PATH || t === G.BLD || t === G.WATER) near = true; }
    if (!near && hash(x, y) < 0.2) set(x, y, G.TREE);
    else if (hash(x, y, 3) < 0.09) set(x, y, G.FLOWER);
  }
  const things = [
    { id: "sign-welcome", x: 21, y: 14, kind: "sign", name: "Signpost" },
    { id: "sign-garden", x: 32, y: 14, kind: "sign", name: "Garden sign" },
  ];
  const npcs = [{ id: "ralphie", x: 9, y: 24, px: 9, py: 24, dir: "left", kind: "buffalo", name: "Ralphie", t: 0, area: [2, 23, 12, 24] }];

  /* ================= Rendering ================= */
  const cv = $("#game"), ctx = cv.getContext("2d");
  const world = document.createElement("canvas"); world.width = MW * TS; world.height = MH * TS;
  const wctx = world.getContext("2d");
  const C = { outline: "#2b2135", g1: "#6abe30", g2: "#5fae2a", g3: "#4e9a24", path: "#e8c170", path2: "#d6ad5c", water: "#3e8edd", water2: "#6fb6f2", leaf: "#2f8a3a", leaf2: "#46ad48", trunk: "#6b4226", fence: "#a0703f" };
  const R = (c, x, y, w, h, col) => { c.fillStyle = col; c.fillRect(x, y, w, h); };

  function tileGrass(c, x, y, tx, ty) {
    R(c, x, y, TS, TS, (tx + ty) % 2 ? C.g1 : C.g2);
    for (let i = 0; i < 3; i++) { const hx = Math.floor(hash(tx, ty, i) * 14), hy = Math.floor(hash(tx, ty, i + 9) * 13); R(c, x + hx, y + hy, 1, 2, C.g3); R(c, x + hx + 1, y + hy + 1, 1, 1, C.g3); }
  }
  function tilePath(c, x, y, tx, ty) {
    R(c, x, y, TS, TS, C.path);
    for (let i = 0; i < 4; i++) R(c, x + Math.floor(hash(tx, ty, i) * 15), y + Math.floor(hash(tx, ty, i + 5) * 15), 1, 1, C.path2);
    // soft edges against grass
    if (at(tx, ty - 1) !== G.PATH) R(c, x, y, TS, 1, C.path2);
    if (at(tx, ty + 1) !== G.PATH) R(c, x, y + TS - 1, TS, 1, C.path2);
  }
  function tileTree(c, x, y, tx, ty) {
    tileGrass(c, x, y, tx, ty);
    R(c, x + 3, y + 14, 10, 2, "rgba(0,0,0,.18)");
    R(c, x + 7, y + 10, 2, 5, C.trunk);
    R(c, x + 2, y + 3, 12, 8, C.leaf); R(c, x + 4, y + 1, 8, 12, C.leaf);
    R(c, x + 4, y + 3, 4, 3, C.leaf2); R(c, x + 3, y + 5, 2, 2, C.leaf2);
    R(c, x + 2, y + 2, 1, 1, C.outline);
  }
  function tileFlower(c, x, y, tx, ty) {
    tileGrass(c, x, y, tx, ty);
    const cols = ["#ff6b81", "#ffd93d", "#ffffff", "#c56cf0"];
    for (let i = 0; i < 4; i++) { const fx = x + 2 + Math.floor(hash(tx, ty, i + 20) * 11), fy = y + 2 + Math.floor(hash(tx, ty, i + 30) * 11); R(c, fx, fy, 2, 2, cols[(i + tx) % 4]); R(c, fx + 1, fy + 2, 1, 2, C.g3); }
  }
  function tileFence(c, x, y, tx, ty) {
    tileGrass(c, x, y, tx, ty);
    const h = at(tx - 1, ty) === G.FENCE || at(tx + 1, ty) === G.FENCE, v = at(tx, ty - 1) === G.FENCE || at(tx, ty + 1) === G.FENCE;
    if (h) { R(c, x, y + 6, TS, 2, C.fence); R(c, x, y + 10, TS, 2, C.fence); }
    if (v) { R(c, x + 7, y, 2, TS, C.fence); }
    R(c, x + 6, y + 4, 4, 10, C.fence); R(c, x + 6, y + 4, 4, 1, "#c4925a");
  }
  function drawWater(c, x, y, tx, ty, t) {
    R(c, x, y, TS, TS, C.water);
    const ph = Math.floor(t / 400 + hash(tx, ty) * 4) % 4;
    R(c, x + ((ph * 4 + 3) % 12), y + 4 + (ph % 2) * 6, 4, 1, C.water2);
    R(c, x + ((ph * 3 + 8) % 12), y + 11 - (ph % 2) * 4, 3, 1, C.water2);
    if (at(tx, ty - 1) !== G.WATER) R(c, x, y, TS, 2, "#2a6cb5");
  }

  function drawBuilding(c, b) {
    const x = b.x * TS, y = b.y * TS, w = b.w * TS, h = b.h * TS;
    const roofH = b.kind === "tower" ? 10 : Math.round(h * 0.45);
    R(c, x + 2, y + h - 2, w, 4, "rgba(0,0,0,.2)");
    // walls
    R(c, x, y + roofH, w, h - roofH, b.wall);
    R(c, x, y + roofH, w, 2, "rgba(0,0,0,.12)");
    // roof
    if (b.kind === "tower") {
      R(c, x, y, w, h, b.wall);
      for (let wy = y + 14; wy < y + h - 20; wy += 9) for (let wx = x + 6; wx < x + w - 8; wx += 9) R(c, wx, wy, 5, 5, hash(wx, wy) > .35 ? "#ffd56b" : "#4b5566");
      R(c, x, y, w, 8, b.roof); R(c, x + w / 2 - 1, y - 12, 2, 12, "#9aa3b2"); R(c, x + w / 2 - 2, y - 14, 4, 3, "#ff4d4d");
    } else if (b.kind === "bank") {
      R(c, x - 2, y + roofH - 6, w + 4, 6, "#d7dbe3");
      c.fillStyle = b.roof; c.beginPath(); c.moveTo(x - 2, y + roofH - 6); c.lineTo(x + w / 2, y + 2); c.lineTo(x + w + 2, y + roofH - 6); c.fill();
      for (let px = x + 6; px < x + w - 6; px += 12) R(c, px, y + roofH + 2, 4, h - roofH - 4, "#cfd4de");
    } else {
      c.fillStyle = b.roof;
      R(c, x - 2, y + 2, w + 4, roofH, b.roof);
      for (let ry = y + 5; ry < y + roofH; ry += 4) R(c, x - 2, ry, w + 4, 1, "rgba(0,0,0,.18)");
      R(c, x - 2, y + roofH, w + 4, 2, "rgba(0,0,0,.3)");
      if (b.kind === "campus") { R(c, x + w / 2 - 10, y - 6, 20, 10, b.roof); R(c, x + w / 2 - 6, y - 10, 12, 6, b.roof); }
      if (b.kind === "lab") { R(c, x + w - 14, y - 6, 6, 8, "#9aa3b2"); }
      if (b.kind === "shed") { for (let px = x; px < x + w; px += 6) R(c, px, y + roofH, 1, h - roofH, "rgba(0,0,0,.12)"); }
    }
    // windows
    if (b.kind !== "tower" && b.kind !== "bank") {
      const wy = y + roofH + 6;
      for (let wx = x + 6; wx < x + w - 10; wx += 16) {
        if (Math.abs(wx + 4 - (b.door * TS + 8)) < 14) continue;
        R(c, wx, wy, 9, 8, C.outline); R(c, wx + 1, wy + 1, 7, 6, "#9fd8ff"); R(c, wx + 1, wy + 1, 3, 2, "#e6f7ff"); R(c, wx + 4, wy + 1, 1, 6, C.outline);
      }
    }
    // door
    const dx = b.door * TS + 3, dy = y + h - 14;
    R(c, dx - 1, dy - 1, 12, 15, C.outline); R(c, dx, dy, 10, 14, b.kind === "tower" ? "#5a6475" : "#7a4a2a");
    R(c, dx + 7, dy + 7, 2, 2, "#ffd56b");
    // sign plaque
    c.font = '8px "Press Start 2P"';
    const tw = Math.ceil(c.measureText(b.sign).width) + 6;
    const sx = Math.round(x + w / 2 - tw / 2), sy = b.kind === "tower" ? y + h - 30 : y + roofH - 12;
    R(c, sx - 1, sy - 1, tw + 2, 12, C.outline); R(c, sx, sy, tw, 10, "#fdf6e3");
    c.fillStyle = C.outline; c.textBaseline = "top"; c.fillText(b.sign, sx + 3, sy + 1);
  }

  function drawMachine(c, o, t) {
    const x = o.x * TS, y = o.y * TS;
    R(c, x + 1, y + 13, 14, 3, "rgba(0,0,0,.2)");
    if (o.m === 0) { // bicycle (Endurance)
      c.strokeStyle = C.outline; c.lineWidth = 1;
      c.beginPath(); c.arc(x + 4, y + 11, 3.5, 0, 7); c.arc(x + 12, y + 11, 3.5, 0, 7); c.stroke();
      R(c, x + 4, y + 7, 8, 1, "#e74c3c"); R(c, x + 7, y + 5, 1, 6, "#e74c3c"); R(c, x + 6, y + 4, 3, 1, C.outline); R(c, x + 11, y + 5, 2, 1, C.outline);
    } else if (o.m === 1) { // ticker board (modeltraining)
      R(c, x + 1, y + 1, 14, 11, C.outline); R(c, x + 2, y + 2, 12, 9, "#10151c");
      const k = Math.floor(t / 300);
      for (let i = 0; i < 6; i++) { const hh = 2 + Math.floor(hash(i + k, 3) * 6); R(c, x + 3 + i * 2, y + 10 - hh, 1, hh, hash(i + k, 7) > .4 ? "#2ecc71" : "#e74c3c"); }
      R(c, x + 7, y + 12, 2, 3, C.outline);
    } else if (o.m === 2) { // robot (BuffAI)
      R(c, x + 3, y + 4, 10, 8, C.outline); R(c, x + 4, y + 5, 8, 6, "#d9b48a");
      R(c, x + 5, y + 7, 2, 2, (t / 500 | 0) % 4 ? "#2b2135" : "#d9b48a"); R(c, x + 9, y + 7, 2, 2, (t / 500 | 0) % 4 ? "#2b2135" : "#d9b48a");
      R(c, x + 2, y + 3, 2, 2, "#fdf6e3"); R(c, x + 12, y + 3, 2, 2, "#fdf6e3"); R(c, x + 5, y + 12, 2, 3, C.outline); R(c, x + 9, y + 12, 2, 3, C.outline);
    } else { // card terminal (Circle × Solana)
      R(c, x + 3, y + 2, 10, 12, C.outline); R(c, x + 4, y + 3, 8, 5, "#7cf2c2");
      for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) R(c, x + 5 + i * 2, y + 9 + j * 2, 1, 1, "#fdf6e3");
      const sl = Math.floor(t / 250) % 6; R(c, x + 13, y + 4 + sl, 3, 2, "#9b59b6");

  function afterType() {
    if (page === dlg.pages.length - 1 && dlg.choices) { chEl.innerHTML = dlg.choices.map((c, i) => `<li><button type="button" data-c="${i}">${e(c.label)}</button></li>`).join(""); chEl.querySelector("button").focus(); }
    else more.hidden = false;
  }
  function advance() {
    if (typing) { clearInterval(typing); typing = null; dText.textContent = dlg.pages[page]; afterType(); return; }
    if (page < dlg.pages.length - 1) { page++; showPage(); return; }
    if (dlg.choices) return;
    close();
  }
  function close() { talking = false; dEl.hidden = true; document.body.classList.remove("talking"); }
  chEl.addEventListener("click", (ev) => { const b = ev.target.closest("button"); if (!b) return; const c = dlg.choices[+b.dataset.c]; close(); if (c.run) c.run(); });
  dEl.addEventListener("click", (ev) => { if (!ev.target.closest("button")) advance(); });

  /* ================= HUD ================= */
  function updateGoal() {
    const n = B.filter((b) => visited.has(b.id)).length;
    $("#goal").innerHTML = n >= B.length ? `★ <b>ALL ${B.length}</b> VISITED!` : `★ VISITED <b>${n}/${B.length}</b>`;
    renderMenu();
  }
  let placeTO;
  function showPlace(t, sub) { const el = $("#place"); el.innerHTML = `${e(t.toUpperCase())}${sub ? `<small>${e(sub)}</small>` : ""}`; el.classList.remove("hide"); clearTimeout(placeTO); }
  function hidePlace() { placeTO = setTimeout(() => $("#place").classList.add("hide"), 250); }
  let lastDoor = null;
  function doorHint() {
    if (scene) return;
    const b = B.find((b) => Math.abs(player.x - b.door) <= 1 && player.y === b.y + b.h);
    const k = b ? b.id : null;
    if (k === lastDoor) return; lastDoor = k;
    if (b) showPlace(b.name, `${b.what} · ${visited.has(b.id) ? "visited ✓" : "walk up to go inside"}`); else hidePlace();
  }

  const menu = $("#menu"), menuBtn = $("#menuBtn");
  function renderMenu() {
    menu.innerHTML = `<h2>TOWN MAP</h2>` + B.map((b) => `<button type="button" data-go="${b.id}">${visited.has(b.id) ? '<span class="ok">✓</span>' : "▼"} ${e(b.name)} <span style="color:#8a7a6a">— ${e(b.what)}</span></button>`).join("");
  }
  const setMenu = (open) => { menu.hidden = !open; menuBtn.setAttribute("aria-expanded", String(open)); if (open) menu.querySelector("button").focus(); };
  menuBtn.onclick = () => setMenu(menu.hidden);
  menu.addEventListener("click", (ev) => { const b = ev.target.closest("[data-go]"); if (!b) return; setMenu(false); start(); if (scene) { scene = null; } enter(b.dataset.go); });

  /* ================= Input ================= */
  const keyDir = { ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down", ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right" };
  let started = false;
  function start() { if (started) return; started = true; $("#title").hidden = true; if (!visited.size) setTimeout(() => interact("sign-welcome"), 300); }
  $("#title").addEventListener("click", start);
  addEventListener("keydown", (ev) => {
    if (!started) { if (!ev.metaKey && !ev.ctrlKey) { ev.preventDefault(); start(); } return; }
    if (ev.code === "KeyM") { setMenu(menu.hidden); return; }
    if (ev.code === "Escape") { if (!menu.hidden) setMenu(false); else if (talking && !dlg.choices) close(); return; }
    if (!menu.hidden) return;
    if (ev.code === "Space" || ev.code === "Enter" || ev.code === "KeyZ") {
      if (talking && ev.target.closest && ev.target.closest(".choices")) return;
      ev.preventDefault(); pressA(); return;
    }
    const d = keyDir[ev.code];
    if (d && !talking) { ev.preventDefault(); path = null; if (!held.includes(d)) held.push(d); }
  });
  addEventListener("keyup", (ev) => { const d = keyDir[ev.code]; const i = held.indexOf(d); if (i >= 0) held.splice(i, 1); });
  document.querySelectorAll(".dpad button").forEach((b) => {
    const d = b.dataset.dir;
    b.addEventListener("pointerdown", (ev) => { ev.preventDefault(); start(); path = null; if (!held.includes(d)) held.push(d); });
    const up = () => { const i = held.indexOf(d); if (i >= 0) held.splice(i, 1); };
    b.addEventListener("pointerup", up); b.addEventListener("pointercancel", up); b.addEventListener("pointerleave", up);
  });
  $("#aBtn").addEventListener("pointerdown", (ev) => { ev.preventDefault(); start(); pressA(); });
  cv.addEventListener("pointerdown", (ev) => {
    if (!started) return start();
    if (talking) return advance();
    if (!menu.hidden) return setMenu(false);
    const tx = Math.floor((ev.clientX / scale + cam.x) / TS), ty = Math.floor((ev.clientY / scale + cam.y) / TS);
    if (scene) {
      if (tx === EXIT_X && ty >= scene.h) return goTo([[EXIT_X, scene.h - 1, "down"]], leave);
      const o = scene.objs.find((o) => DIALOGS[o.id] && tx >= o.x && tx < o.x + o.w && ty >= o.y - (o.kind === "rack" ? 1 : 0) && ty < o.y + o.h);
      if (o) { const g = around(o); return goTo(g.length ? g : [[o.x, o.y + o.h, "up"]], () => interact(o.id)); }
    } else {
      const b = B.find((b) => tx >= b.x && tx < b.x + b.w && ty >= b.y && ty < b.y + b.h);
      if (b) return goTo([[b.door, b.y + b.h, "up"]], () => enter(b.id));
      const id = targetAt(tx, ty);
      if (id) { const o = things.find((o) => o.id === id) || npcs.find((n) => n.id === id); return goTo(around(o), () => interact(id)); }
    }
    if (!solid(tx, ty)) { const p = bfs(player.x, player.y, [[tx, ty]]); if (p) { path = p; pending = null; } }
  });

  /* ================= Loop ================= */
  let scale = 3, cam = { x: 0, y: 0 }, VW = 0, VH = 0;
  function resize() {
    const W = innerWidth, H = innerHeight, dpr = Math.min(devicePixelRatio || 1, 2);
    scale = scene ? Math.max(2, Math.floor(Math.min(W / (TS * (scene.w + 1.5)), H / (TS * (scene.h + 4))))) : Math.max(2, Math.floor(Math.min(W / (TS * (W < 700 ? 12 : 20)), H / (TS * (W < 700 ? 9 : 12)))));
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.imageSmoothingEnabled = false;
    VW = W; VH = H;
  }

  function updateNPCs(now) {
    if (scene) return;
    npcs.forEach((n) => {
      if (n.step) { const k = Math.min(1, (now - n.step.t0) / 380); n.px = n.step.fx + (n.x - n.step.fx) * k; n.py = n.step.fy + (n.y - n.step.fy) * k; if (k >= 1) { n.step = null; n.moving = false; } return; }
      if (talking || now < n.t) return;
      n.t = now + 900 + Math.random() * 1800;
      const dirs = Object.entries(DIRS).filter(([d, [dx, dy]]) => { const nx = n.x + dx, ny = n.y + dy, [a, b, c2, d2] = n.area; return nx >= a && nx <= c2 && ny >= b && ny <= d2 && !solid(nx, ny) && !(nx === player.x && ny === player.y); });
      if (!dirs.length || Math.random() < .3) return;
      const [, [dx, dy]] = dirs[Math.floor(Math.random() * dirs.length)];
      if (dx) n.dir = dx > 0 ? "right" : "left";
      n.step = { fx: n.x, fy: n.y, t0: now }; n.x += dx; n.y += dy; n.moving = true;
    });
  }

  function marker(c, x, y, now, col = "#ffd75e") {
    const b = Math.floor(now / 250) % 2;
    R(c, x - 4, y - 7 + b, 9, 3, C.outline); R(c, x - 3, y - 6 + b, 7, 1, col);
    R(c, x - 2, y - 4 + b, 5, 2, C.outline); R(c, x - 1, y - 4 + b, 3, 1, col);
    R(c, x - 1, y - 2 + b, 3, 2, C.outline); R(c, x, y - 2 + b, 1, 1, col);
  }

  function frame() {
    const now = performance.now(); // same clock as step/fade start times
    if (step) {
      const k = Math.min(1, (now - step.t0) / STEP_MS);
      player.px = step.fx + (step.tx - step.fx) * k; player.py = step.fy + (step.ty - step.fy) * k;
      if (k >= 1) { step = null; player.px = player.x; player.py = player.y; }
    }
    if (!step && !talking && !fadeCb) {
      if (held.length) tryStep(held[held.length - 1]);
      else if (path && path.length) {
        const [nx, ny] = path.shift();
        const dir = nx > player.x ? "right" : nx < player.x ? "left" : ny > player.y ? "down" : "up";
        if (!tryStep(dir)) path = null;
      } else {
        player.moving = false;
        if (path && !path.length) {
          path = null;
          if (pending) { const pi = pending; pending = null; const g = pi.goals.find(([x, y]) => x === player.x && y === player.y); if (g) { player.dir = g[2] || player.dir; pi.then(); } }
        }
      }
    }
    updateNPCs(now);
    doorHint();

    const [mw, mh] = dims(), vw = VW / scale, vh = VH / scale;
    cam.x = mw * TS < vw ? (mw * TS - vw) / 2 : Math.max(0, Math.min(mw * TS - vw, player.px * TS + 8 - vw / 2));
    cam.y = mh * TS < vh ? (mh * TS - vh) / 2 : Math.max(0, Math.min(mh * TS - vh, player.py * TS + 8 - vh / 2));
    const ox = Math.round(cam.x * scale) / scale, oy = Math.round(cam.y * scale) / scale;

    ctx.fillStyle = "#17131f"; ctx.fillRect(0, 0, VW, VH);
    ctx.save(); ctx.scale(scale, scale); ctx.translate(-ox, -oy);
    if (scene) {
      ctx.drawImage(scene.canvas, 0, 0);
      scene.objs.forEach((o) => { if (["desk", "rack", "sensor", "machine"].includes(o.kind)) drawObj(ctx, o, now); });
      drawPlayer(ctx, player, now);
      // exit arrow on the mat
      if (!talking) { const b = Math.floor(now / 300) % 2; R(ctx, EXIT_X * TS + 6, scene.h * TS + 3 + b, 4, 2, "#fdf6e3"); R(ctx, EXIT_X * TS + 7, scene.h * TS + 5 + b, 2, 2, "#fdf6e3"); }
    } else {
      ctx.drawImage(world, 0, 0);
      const x0 = Math.floor(ox / TS), y0 = Math.floor(oy / TS), x1 = Math.ceil((ox + vw) / TS), y1 = Math.ceil((oy + vh) / TS);
      for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (at(tx, ty) === G.WATER) drawWater(ctx, tx * TS, ty * TS, tx, ty, now);
      B.forEach((b) => { if (!visited.has(b.id)) marker(ctx, b.door * TS + 8, (b.y + b.h - 1) * TS - 2, now); });
      const actors = [...npcs.map((n) => ({ y: n.py, d: () => drawBuffalo(ctx, n, now) })), { y: player.py, d: () => drawPlayer(ctx, player, now) }];
      actors.sort((a, b) => a.y - b.y).forEach((a) => a.d());
    }
    // "!" over whatever you're facing
    const [fx, fy] = facing(), tid = targetAt(fx, fy);
    if (tid && DIALOGS[tid] && !talking && !step) {
      const bx = player.px * TS + 6, by = player.py * TS - 9 - (Math.floor(now / 300) % 2);
      R(ctx, bx - 1, by - 1, 5, 9, C.outline); R(ctx, bx, by, 3, 7, "#fdf6e3"); R(ctx, bx + 1, by + 1, 1, 3, C.outline); R(ctx, bx + 1, by + 5, 1, 1, C.outline);
    }
    ctx.restore();

    if (fadeCb || fadeA > 0) {
      const k = (now - fadeT0) / 200;
      if (fadeCb) { fadeA = Math.min(1, k); if (k >= 1) { const cb = fadeCb; fadeCb = null; fadeT0 = now; cb(); } }
      else fadeA = Math.max(0, 1 - k);
      ctx.fillStyle = `rgba(23,19,31,${fadeA})`; ctx.fillRect(0, 0, VW, VH);
    }
    requestAnimationFrame(frame);
  }

  function bakeWorld() {
    for (let ty = 0; ty < MH; ty++) for (let tx = 0; tx < MW; tx++) {
      const t = at(tx, ty), x = tx * TS, y = ty * TS;
      if (t === G.PATH) tilePath(wctx, x, y, tx, ty);
      else if (t === G.TREE) tileTree(wctx, x, y, tx, ty);
      else if (t === G.FLOWER) tileFlower(wctx, x, y, tx, ty);
      else if (t === G.FENCE) tileFence(wctx, x, y, tx, ty);
      else tileGrass(wctx, x, y, tx, ty);
    }
    B.forEach((b) => drawBuilding(wctx, b));
    things.filter((o) => o.kind === "sign").forEach((o) => drawSign(wctx, o));
  }

  addEventListener("resize", resize);
  resize(); updateGoal();
  const go = () => {
    bakeWorld(); requestAnimationFrame(frame);
    const m = location.hash.match(/room=(\w+)/);
    if (/start|room=/.test(location.hash)) { started = true; $("#title").hidden = true; }
    if (m && ROOMS[m[1]]) { const r = ROOMS[m[1]]; scene = r; bakeRoom(r); player.x = player.px = EXIT_X; player.y = player.py = r.h - 1; resize(); showPlace(r.title, "Walk up to things with a ! and press A · step on the red mat to leave"); }
  };
  // Don't let a slow font load hold the game hostage.
  let went = false; const goOnce = () => { if (!went) { went = true; go(); } };
  setTimeout(goOnce, 1500);
  if (document.fonts) document.fonts.load('8px "Press Start 2P"').then(goOnce, goOnce); else goOnce();
})();
</script>
</body>
</html>
